<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#121315"><title>theDĀW Studio — demo</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:#f3f0e9;background:#111315;font-size:15px}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}a{color:#c8ff72}header{height:74px;padding:0 4%;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #2a2d2c;background:#151719}.logo{font-size:23px;font-weight:900;letter-spacing:-1.5px}.logo span{font-size:11px;letter-spacing:2px;color:#bdc3bc;margin-left:14px}.pill{background:#292e2b;border:1px solid #454b41;padding:7px 12px;border-radius:99px;font-size:11px;color:#c8ff72;font-weight:800;letter-spacing:1px}.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:calc(100vh - 74px)}nav{border-right:1px solid #2a2d2c;padding:27px 14px;background:#151719}nav button{display:flex;gap:13px;align-items:center;border:0;background:transparent;color:#afb5b0;padding:13px 15px;border-radius:11px;width:100%;text-align:left;margin:4px 0}nav button.active,nav button:hover{background:#2b3228;color:#d5ff95}nav .small{font-size:10px;letter-spacing:2px;color:#808b82;margin:21px 14px 9px}main{padding:38px 5%;max-width:1400px;width:100%;margin:auto}h1{font-size:clamp(28px,4vw,47px);margin:0 0 9px;letter-spacing:-2px}h2{font-size:22px;margin:0 0 15px}p.muted,.muted{color:#a1aaa1}p{line-height:1.65} .topline{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:27px}.controls{display:flex;gap:9px;flex-wrap:wrap}.btn{border:1px solid #495046;background:#272c29;color:#f4f4ec;border-radius:9px;padding:11px 16px;font-weight:700}.btn.primary{background:#d3ff86;color:#161b12;border-color:#d3ff86}.btn:hover{filter:brightness(1.11)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{border:1px solid #353936;background:#1c201f;border-radius:16px;padding:20px}.card h3{line-height:1.35;font-size:20px;margin:14px 0}.tag{color:#cfff84;text-transform:uppercase;letter-spacing:1.3px;font-size:10px;font-weight:800}.meta{font-size:12px;color:#9aa49b}.card .actions{display:flex;gap:7px;margin-top:20px;flex-wrap:wrap}input,textarea,select{background:#181b1a;color:#fff;border:1px solid #505951;border-radius:9px;padding:12px;width:100%}textarea{min-height:125px;resize:vertical}label{display:block;font-size:12px;font-weight:800;color:#c5cec3;margin:17px 0 8px}.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}.split{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(250px,.8fr);gap:20px}.stack{display:grid;gap:13px}.statrow{display:flex;gap:10px;flex-wrap:wrap}.stat{padding:14px 19px;border-radius:12px;background:#242a26;min-width:135px}.stat b{display:block;font-size:24px}.stat span{font-size:11px;color:#a5b0a5}.empty{padding:60px;text-align:center;color:#adb6ae;border:1px dashed #525952;border-radius:16px}.preview{width:100%;max-width:380px;aspect-ratio:4/5;margin:auto;background:radial-gradient(circle at 80% 18%,#729e55 0%,transparent 30%),linear-gradient(160deg,#39453c,#141615 58%,#222d23);border:1px solid #505b4c;display:flex;flex-direction:column;justify-content:space-between;padding:23px;overflow:hidden}.preview .brand{font-size:25px;font-weight:900;letter-spacing:-1px}.preview .headline{font-size:clamp(23px,3vw,39px);line-height:1.02;overflow-wrap:anywhere;font-weight:900;letter-spacing:-1.4px;text-transform:uppercase}.preview .foot{font-size:11px;letter-spacing:1px;color:#d4e4ce}.mediaitem{border:1px solid #434945;border-radius:12px;padding:15px;background:#252925}.mediaitem small{display:block;color:#acb3aa;margin-top:7px}.steps{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}.step{background:#252a26;border:1px solid #343a35;border-radius:90px;padding:8px 12px;color:#9ca69d;font-size:12px}.step.on{background:#32422c;border-color:#b8ed74;color:#dbffa8}.banner{padding:16px 20px;border:1px solid #5a694e;background:#273327;border-radius:12px;margin:17px 0;color:#d6e9d0}.danger{background:#3a2924;border-color:#795c51;color:#f0c7bb}footer{font-size:12px;color:#8a968b;margin-top:40px}.mini{font-size:12px}.link{color:#c8ff72} .hidden{display:none!important}@media(max-width:960px){.grid{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}}@media(max-width:670px){.app{display:block}nav{display:flex;overflow-x:auto;border-right:none;border-bottom:1px solid #2a2d2c;padding:7px}nav button{white-space:nowrap;font-size:12px}nav .small{display:none}main{padding:25px 17px}.grid,.two{grid-template-columns:1fr}.logo span{display:none}.card{padding:15px}}
</style></head><body><header><div class="logo">theDĀW<span>STUDIO / WORKSPACE</span></div><div class="pill">● LOCAL DEMO</div></header><div class="app"><nav><div class="small">WORKSPACE</div><button data-view="inbox" class="active">▦ &nbsp; Новости</button><button data-view="drafts">✎ &nbsp; Черновики</button><button data-view="media">▧ &nbsp; Медиатека</button><button data-view="design">◈ &nbsp; Дизайн</button><button data-view="publish">↗ &nbsp; Публикация</button><div class="small">SYSTEM</div><button data-view="settings">⚙ &nbsp; Подключения</button></nav><main id="main"></main></div><script>const K='thedaw_studio_v02';let saved={};try{saved=JSON.parse(localStorage.getItem(K))||{}}catch(e){};let data={news:[],drafts:saved.drafts||[],media:saved.media||[]},view='inbox',current=null;const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>localStorage.setItem(K,JSON.stringify({drafts:data.drafts,media:data.media}));function go(v){view=v;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));render()}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.view));function create(id){let n=data.news.find(x=>x.id===id);if(!n)return;let d={id:'d'+Date.now(),sourceUrl:n.url,sourceTitle:n.title,sourceSummary:n.summary,sourceName:n.source,headline:n.title,caption:n.title+'\n\n'+n.summary+'\n\nИсточник: '+n.source+' — '+n.url,tiktok:n.title,category:n.category};data.drafts.unshift(d);current=d.id;save();go('drafts')}function update(k,v){let d=data.drafts.find(x=>x.id===current);if(d){d[k]=v;save()}}function render(){if(view==='design'){renderDesign();return}let m=document.querySelector('#main');if(!m)return;if(view==='inbox'){m.innerHTML='<h1>Новости</h1><p class="muted">Автоматическая лента из RSS. Проверяйте первоисточники.</p><div class="grid">'+(data.news.length?data.news.map(n=>'<article class="card"><span class="tag">'+esc(n.category)+'</span><h3>'+esc(n.title)+'</h3><p class="muted">'+esc(n.summary)+'</p><div class="meta">'+esc(n.source)+' · '+esc(n.date)+'</div><div class="actions"><button class="btn primary" data-create="'+esc(n.id)+'">Создать пост →</button> <a class="btn" href="'+esc(n.url)+'" target="_blank" rel="noopener noreferrer">Источник ↗</a></div></article>').join(''):'<p class="muted">Загружаем новости…</p>')+'</div>';m.querySelectorAll('[data-create]').forEach(b=>b.onclick=()=>create(b.dataset.create))}else if(view==='drafts'){m.innerHTML='<h1>Черновики</h1>'+data.drafts.map(d=>'<div class="card"><h3>'+esc(d.headline)+'</h3><div class="actions"><button class="btn primary" data-ai="'+esc(d.id)+'">✨ Написать с AI</button><a class="btn" href="https://www.canva.com/design/DAHXQ4rCB5s/erMvoEWYI_CoRN9gxyI7LQ/edit" target="_blank" rel="noopener noreferrer" title="Открой шаблон, создай копию через Файл → Создать копию и вставь текст из черновика">◈ Открыть шаблон Canva ↗</a></div><p class="muted" id="status-'+esc(d.id)+'"></p><label>Заголовок</label><input data-id="'+esc(d.id)+'" data-field="headline" value="'+esc(d.headline)+'"><label>Instagram</label><textarea data-id="'+esc(d.id)+'" data-field="caption" rows="6">'+esc(d.caption)+'</textarea><label>TikTok</label><textarea data-id="'+esc(d.id)+'" data-field="tiktok" rows="3">'+esc(d.tiktok)+'</textarea></div>').join('');m.querySelectorAll('[data-ai]').forEach(b=>b.onclick=()=>generateAI(b.dataset.ai));m.querySelectorAll('[data-field]').forEach(el=>el.oninput=()=>{let d=data.drafts.find(x=>x.id===el.dataset.id);if(d){d[el.dataset.field]=el.value;save()}})}else if(view==='media'){m.innerHTML='<h1>Медиатека</h1><p class="muted">Пока сохраняем ссылки, не скачиваем видео.</p><input id="mediaUrl" placeholder="Ссылка на TikTok или медиа"><button class="btn primary" id="addMedia">Сохранить ссылку</button>'+data.media.map(x=>'<div class="card"><a href="'+esc(x)+'" target="_blank">'+esc(x)+'</a></div>').join('');m.querySelector('#addMedia').onclick=()=>{let u=m.querySelector('#mediaUrl').value;if(/^https?:\/\//.test(u)){data.media.unshift(u);save();render()}}}else{m.innerHTML='<h1>'+({design:'Дизайн',publish:'Публикация',settings:'Подключения'}[view]||'Раздел')+'</h1>'+(view==='settings'?'<div class="card"><h3>AI-копирайтер</h3><p class="muted">Укажи адрес своего Cloudflare Worker и пароль доступа. Пароль хранится только до закрытия вкладки.</p><label>Worker URL</label><input id="workerUrl" placeholder="https://...workers.dev" value="'+esc(localStorage.getItem('daw_worker_url')||'')+'"><label>Пароль</label><input id="workerPassword" type="password" placeholder="Пароль из Cloudflare"><button class="btn primary" id="saveAI">Сохранить настройки AI</button></div>':'<div class="card"><p class="muted">Этот раздел пока в разработке. Canva и соцсети ещё не подключены.</p></div>');if(view==='settings')m.querySelector('#saveAI').onclick=()=>{localStorage.setItem('daw_worker_url',m.querySelector('#workerUrl').value.trim());sessionStorage.setItem('daw_ai_password',m.querySelector('#workerPassword').value);alert('Настройки AI сохранены для этой вкладки')}}}async function load(){try{let r=await fetch('./news.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);let n=await r.json();if(!Array.isArray(n))throw Error('Неверный формат');data.news=n;render()}catch(e){document.querySelector('#main').innerHTML='<h1>Новости</h1><p>Не удалось загрузить news.json: '+esc(e.message)+'</p>'}}
async function generateAI(id){
 const d=data.drafts.find(x=>x.id===id);if(!d)return;
 const url=(localStorage.getItem('daw_worker_url')||'').trim();
 const password=sessionStorage.getItem('daw_ai_password')||'';
 if(!url||!password){alert('Сначала открой «Подключения» и введи Worker URL и пароль');go('settings');return}
 const el=document.getElementById('status-'+id);if(el)el.textContent='AI готовит текст…';
 try{
  const r=await fetch(url.replace(/\/$/,'')+'/generate',{method:'POST',headers:{'Content-Type':'application/json','X-Studio-Key':password},body:JSON.stringify({title:d.sourceTitle||d.headline,summary:d.sourceSummary||'',source:d.sourceName||'',url:d.sourceUrl||'',category:d.category||''})});
  const obj=await r.json();if(!r.ok)throw Error(obj.error||'HTTP '+r.status);
  d.headline=obj.headline||d.headline;d.caption=obj.instagram||d.caption;d.tiktok=obj.tiktok||d.tiktok;save();render();
 }catch(e){const msg=document.getElementById('status-'+id);if(msg)msg.textContent='Ошибка: '+e.message}
}
render();load();</script><style>
.design-layout{display:grid;grid-template-columns:minmax(270px,400px) minmax(270px,1fr);gap:22px;align-items:start}
.design-form{display:grid;gap:12px}.design-form label{margin:0}.design-stage{display:flex;justify-content:center;background:#242a26;padding:16px;border-radius:15px}
#designCanvas{width:100%;max-width:410px;aspect-ratio:9/16;touch-action:none;cursor:grab}
@media(max-width:800px){.design-layout{grid-template-columns:1fr}.design-stage{order:-1}#designCanvas{max-width:330px}}
</style>
<script>
let designCfg={title:'',body:'',date:'',bg:'#181d1b',accent:'#d3ff86',size:76,bodySize:35,titleY:1120,bodyY:1390,image:''},designImg=null,designDrag=null;
try{Object.assign(designCfg,JSON.parse(localStorage.getItem('daw_native_design')||'{}'))}catch(e){}
function designStore(){try{localStorage.setItem('daw_native_design',JSON.stringify(designCfg))}catch(e){let x=document.getElementById('designNotice');if(x)x.textContent='Фотография слишком большая для хранения в браузере. Скачай PNG.'}}
function designWrap(ctx,txt,x,y,width,size,lines){ctx.font='bold '+size+'px Arial';let words=String(txt||'').split(/\s+/),rows=[],line='';for(let word of words){let next=line?line+' '+word:word;if(ctx.measureText(next).width>width&&line){rows.push(line);line=word}else line=next}rows.push(line);rows.slice(0,lines).forEach((t,i)=>ctx.fillText(t,x,y+i*size*1.18))}
function designPaint(){let cv=document.getElementById('designCanvas');if(!cv)return;let ctx=cv.getContext('2d'),s=designCfg;ctx.fillStyle=s.bg;ctx.fillRect(0,0,1080,1920);if(designImg){let k=Math.max(1080/designImg.width,1920/designImg.height),w=designImg.width*k,h=designImg.height*k;ctx.drawImage(designImg,(1080-w)/2,(1920-h)/2,w,h)}let g=ctx.createLinearGradient(0,700,0,1920);g.addColorStop(0,'#00000000');g.addColorStop(1,'#000000e8');ctx.fillStyle=g;ctx.fillRect(0,650,1080,1270);ctx.textBaseline='top';ctx.fillStyle=s.accent;ctx.fillRect(85,98,8,67);ctx.fillStyle='white';ctx.font='bold 54px Arial';ctx.fillText('theDĀW',115,99);ctx.font='28px Arial';ctx.fillText(s.date||new Date().toLocaleDateString('ru-RU'),855,112);ctx.fillStyle=s.accent;ctx.fillRect(85,s.titleY-27,70,7);ctx.fillStyle='white';designWrap(ctx,s.title||'ЗАГОЛОВОК НОВОСТИ',85,s.titleY,910,+s.size,5);ctx.fillStyle='#e7e7e7';designWrap(ctx,s.body||'Описание новости',85,s.bodyY,910,+s.bodySize,9);ctx.fillStyle=s.accent;ctx.fillRect(85,1835,910,3);ctx.fillStyle='#eeeeee';ctx.font='24px Arial';ctx.fillText('CULTURE  /  MUSIC  /  NEWS',85,1858)}
function designImageLoad(src){if(!src){designImg=null;designPaint();return}let im=new Image();im.onload=()=>{designImg=im;designPaint()};im.src=src}
function renderDesign(){let m=document.getElementById('main'),s=designCfg;if(!m)return;m.innerHTML='<h1>Дизайн theDĀW</h1><p class="muted">Встроенный редактор Reels / TikTok · 1080 × 1920. Перетаскивай текст на макете.</p><div class="design-layout"><div class="card design-form"><label>Подставить новость из черновиков</label><select id="designDraft"><option value="">Выбери черновик</option>'+data.drafts.map(d=>'<option value="'+esc(d.id)+'">'+esc(d.headline)+'</option>').join('')+'</select><button class="btn" id="designFill">Подставить текст</button><label>Заголовок</label><textarea id="designTitle" rows="3"></textarea><label>Описание</label><textarea id="designBody" rows="5"></textarea><label>Дата</label><input id="designDate"><label>Загрузить фоновое фото</label><input type="file" accept="image/*" id="designFile"><button class="btn" id="designClear">Убрать фото</button><label>Цвет фона</label><input type="color" id="designBg"><label>Акцентный цвет</label><input type="color" id="designAccent"><label>Размер заголовка</label><input type="number" min="30" max="130" id="designSize"><label>Размер описания</label><input type="number" min="20" max="70" id="designBodySize"><button class="btn" id="designReset">Сбросить положение текста</button><button class="btn primary" id="designDownload">↓ Скачать PNG</button><p class="muted mini" id="designNotice">Настройки сохраняются в этом браузере.</p></div><div class="design-stage"><canvas id="designCanvas" width="1080" height="1920"></canvas></div></div>';
let fields={designTitle:'title',designBody:'body',designDate:'date',designBg:'bg',designAccent:'accent',designSize:'size',designBodySize:'bodySize'};Object.keys(fields).forEach(id=>{let el=document.getElementById(id),key=fields[id];el.value=s[key];el.oninput=()=>{s[key]=el.type==='number'?Number(el.value):el.value;designStore();designPaint()}});
document.getElementById('designFill').onclick=()=>{let d=data.drafts.find(x=>x.id===document.getElementById('designDraft').value);if(!d)return;s.title=d.headline||'';s.body=(d.caption||'').replace(d.headline||'','').replace(/Источник:[\s\S]*/,'').trim().slice(0,600);s.date=new Date().toLocaleDateString('ru-RU');designStore();renderDesign()};
document.getElementById('designClear').onclick=()=>{s.image='';designImageLoad('');designStore()};
document.getElementById('designReset').onclick=()=>{s.titleY=1120;s.bodyY=1390;designStore();designPaint()};
document.getElementById('designFile').onchange=e=>{let file=e.target.files[0];if(!file||!file.type.startsWith('image/'))return;let reader=new FileReader();reader.onload=()=>{let im=new Image();im.onload=()=>{let c=document.createElement('canvas'),k=Math.min(1,1600/Math.max(im.width,im.height));c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);s.image=c.toDataURL('image/jpeg',.72);designImageLoad(s.image);designStore()};im.src=reader.result};reader.readAsDataURL(file)};
document.getElementById('designDownload').onclick=()=>{designPaint();let a=document.createElement('a');a.href=document.getElementById('designCanvas').toDataURL('image/png');a.download='theDAW-'+Date.now()+'.png';a.click()};
let cv=document.getElementById('designCanvas');cv.onpointerdown=e=>{let r=cv.getBoundingClientRect(),y=(e.clientY-r.top)/r.height*1920;designDrag=Math.abs(y-s.titleY)<Math.abs(y-s.bodyY)?'titleY':'bodyY';cv.setPointerCapture(e.pointerId)};cv.onpointermove=e=>{if(!designDrag)return;let r=cv.getBoundingClientRect();s[designDrag]=Math.round(Math.max(220,Math.min(1750,(e.clientY-r.top)/r.height*1920)));designPaint()};cv.onpointerup=()=>{designDrag=null;designStore()};cv.onpointercancel=()=>{designDrag=null;designStore()};
if(s.image)designImageLoad(s.image);else{designImg=null;designPaint()}
}
</script></body></html>
