</style></head><body><header><div class="logo">theDĀW<span>STUDIO / WORKSPACE</span></div><div class="pill">● LOCAL DEMO</div></header><div class="app"><nav><div class="small">WORKSPACE</div><button data-view="inbox" class="active">▦ &nbsp; Новости</button><button data-view="drafts">✎ &nbsp; Черновики</button><button data-view="media">▧ &nbsp; Медиатека</button><button data-view="design">◈ &nbsp; Дизайн</button><button data-view="publish">↗ &nbsp; Публикация</button><div class="small">SYSTEM</div><button data-view="settings">⚙ &nbsp; Подключения</button></nav><main id="main"></main></div><script>const K='thedaw_studio_v02';let saved={};try{saved=JSON.parse(localStorage.getItem(K))||{}}catch(e){};let data={news:[],drafts:saved.drafts||[],media:saved.media||[]},view='inbox',current=null,newsPage=1,newsLoading=false,newsError='';const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>localStorage.setItem(K,JSON.stringify({drafts:data.drafts,media:data.media}));function go(v){view=v;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));render()}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.view));function create(id){let n=data.news.find(x=>x.id===id);if(!n)return;let d={id:'d'+Date.now(),sourceUrl:n.url,sourceTitle:n.title,sourceSummary:n.summary,sourceName:n.source,headline:n.title,caption:n.title+'\n\n'+n.summary+'\n\nИсточник: '+n.source+' — '+n.url,tiktok:n.title,category:n.category};data.drafts.unshift(d);current=d.id;save();go('drafts')}function update(k,v){let d=data.drafts.find(x=>x.id===current);if(d){d[k]=v;save()}}function newsTimestamp(n){

 const ru=raw.match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})(?:\s+(\d{1,2}):(\d{2}))?/);
 if(ru){const d=new Date(Number(ru[3]),Number(ru[2])-1,Number(ru[1]),Number(ru[4]||0),Number(ru[5]||0));return d.getFullYear()===Number(ru[3])&&d.getMonth()===Number(ru[2])-1&&d.getDate()===Number(ru[1])?d.getTime():NaN}

 (newsError?'<p class="banner danger">'+esc(newsError)+'</p>':'')+

lue="'+esc(localStorage.getItem('daw_worker_url')||'')+'"><label>Пароль</label><input id="workerPassword" type="password" placeholder="Пароль из Cloudflare"><button class="btn primary" id="saveAI">Сохранить настройки AI</button><hr style="border:0;border-top:1px solid #454b41;margin:24px 0"><h3>Instagram · @thedaw.mag</h3><p class="muted">Проверить соединение с Instagram API. Проверка ничего не публикует.</p><button class="btn" id="checkInstagram">Проверить Instagram</button><p class="muted" id="instagramCheckStatus" role="status" aria-live="polite"></p></div>':'<div class="card"><p class="muted">Этот раздел пока в разработке. Canva и соцсети ещё не подключены.</p></div>');if(view==='settings'){m.querySelector('#saveAI').onclick=()=>{localStorage.setItem('daw_worker_url',m.querySelector('#workerUrl').value.trim());sessionStorage.setItem('daw_ai_password',m.querySelector('#workerPassword').value);alert('Настройки AI сохранены для этой вкладки')};m.querySelector('#checkInstagram').onclick=async()=>{const status=m.querySelector('#instagramCheckStatus'),btn=m.querySelector('#checkInstagram');const url=(m.querySelector('#workerUrl').value||'').trim().replace(/\/$/,'');const password=m.querySelector('#workerPassword').value||sessionStorage.getItem('daw_ai_password')||'';if(!url||!password){status.textContent='Сначала введи Worker URL и пароль в разделе Подключения.';return}if(!url.startsWith('https://')){status.textContent='Worker URL должен начинаться с https://';return}btn.disabled=true;status.textContent='Проверяем подключение…';try{const response=await fetch(url+'/instagram/check',{method:'POST',headers:{'Content-Type':'application/json','X-Studio-Key':password}});const result=await response.json();if(!response.ok||!result.ok)throw Error(result.instagram_error||result.error||'HTTP '+response.status);status.textContent='✓ Instagram подключён: @'+(result.instagram?.username||'неизвестно')+' (ID: '+(result.instagram?.id||'—')+').';}catch(error){status.textContent='Ошибка <script>
const DESIGN_DEFAULTS={title:'',body:'',date:'',bg:'#181d1b',accent:'#d3ff86',size:40,bodySize:22,titleY:1130,bodyY:1302,image:'',logo:'',cropZoom:1,cropX:0,cropY:0};
let designCfg={title:'',body:'',date:'',bg:'#181d1b',accent:'#d3ff86',size:40,bodySize:22,titleY:1130,bodyY:1302,image:'',logo:'',cropZoom:1,cropX:0,cropY:0},designImg=null,designDrag=null,designVideo=null,designLogo=null,designRecording=false,designCancelExport=null;
try{Object.assign(designCfg,JSON.parse(localStorage.getItem('daw_native_design')||'{}'))}catch(e){}
function designStore(){try{localStorage.setItem('daw_native_design',JSON.stringify(designCfg))}catch(e){let x=document.getElementById('designNotice');if(x)x.textContent='Фотография слишком большая для хранения в браузере. Скачай PNG.'}}
function designWrap(ctx,txt,x,y,width,size,lines,style='title'){
 const title=style==='title',tracking=title?-.022*size:-.011*size,leading=title?1.12:1.22;
 ctx.font=title?'900 '+size+'px Montserrat,Arial,sans-serif':'italic 400 '+size+'px Montserrat,Arial,sans-serif';
 const measure=t=>{let w=0;for(const ch of t)w+=ctx.measureText(ch).width+tracking;return w};
 let words=String(txt||'').split(/\s+/),rows=[],line='';
 for(const word of words){let next=line?line+' '+word:word;if(measure(next)>width&&line){rows.push(line);line=word}else line=next}rows.push(line);
 rows.slice(0,lines).forEach((t,i)=>{let xx=x;for(const ch of t){ctx.fillText(ch,xx,y+i*size*leading);xx+=ctx.measureText(ch).width+tracking}});
}
function designPaint(){
 let cv=document.getElementById('designCanvas');if(!cv)return;
 let ctx=cv.getContext('2d'),s=designCfg;
 ctx.fillStyle=s.bg;ctx.fillRect(0,0,1080,1920);
 const media=designVideo&&designVideo.readyState>=2?designVideo:designImg;
 if(media){let mw=media.videoWidth||media.width,mh=media.videoHeight||media.height;if(mw>0&&mh>0){
 const k=Math.max(1080/mw,1920/mh)*Math.max(1,Number(s.cropZoom)||1),w=mw*k,h=mh*k;
 const dx=(1080-w)/2+(Number(s.cropX)||0),dy=(1920-h)/2+(Number(s.cropY)||0);
 ctx.save();ctx.beginPath();ctx.rect(0,0,1080,1920);ctx.clip();ctx.drawImage(media,dx,dy,w,h);ctx.restore();
 }}

 ctx.save();ctx.beginPath();ctx.rect(0,0,1080,1920);ctx.clip();
 ctx.translate(-650,-180);ctx.rotate(-0.11);ctx.font='900 104px Arial,sans-serif';ctx.fillStyle='rgba(255,255,255,0.075)';
 for(let y=0;y<2400;y+=112){let text=Array(9).fill('theDAW').join(' ');ctx.fillText(text,-300,y)}
 ctx.restore();
 let top=ctx.createLinearGradient(0,0,0,520);top.addColorStop(0,'rgba(0,0,0,.55)');top.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=top;ctx.fillRect(0,0,1080,520);
 let g=ctx.createLinearGradient(0,670,0,1920);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(.5,'rgba(0,0,0,.42)');g.addColorStop(1,'rgba(0,0,0,.84)');ctx.fillStyle=g;ctx.fillRect(0,670,1080,1250);
 ctx.textBaseline='top';ctx.fillStyle='#fff';
 if(designLogo&&designLogo.complete&&designLogo.naturalWidth){ctx.drawImage(designLogo,108,106,84,129)}
 ctx.font='400 28.5px Arial,sans-serif';ctx.textAlign='right';ctx.fillText(s.date||designShortDate(),970,155);ctx.textAlign='left';
 ctx.fillStyle='#fff';designWrap(ctx,s.title||'ЗАГОЛОВОК НОВОСТИ',108,s.titleY,862,+s.size,5);
 ctx.fillStyle='#f3f3f3';designWrap(ctx,s.body||'Описание новости',108,s.bodyY,800,+s.bodySize,9,'body');
}
function designLogoLoad(src){src=src||'assets/thedaw-logo.svg';let im=new Image();im.onload=()=>{designLogo=im;designPaint()};im.src=src}
function designImageLoad(src){if(!src){designImg=null;designPaint();return}let im=new Image();im.onload=()=>{designImg=im;designPaint()};im.src=src}
function designShortDate(){const d=new Date();return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')}
function renderDesign(){let m=document.getElementById('main'),s=designCfg;if(!m)return;m.innerHTML='<h1>Дизайн theDĀW</h1><p class="muted">Шаблон по Canva theDAW - reels · 1080 × 1920. Перетаскивай текст на макете.</p><div class="design-layout"><div class="card design-form"><label>Подставить новость из черновиков</label><select id="designDraft"><option value="">Выбери черновик</option>'+data.drafts.map(d=>'<option value="'+esc(d.id)+'">'+esc(d.headline)+'</option>').join('')+'</select><button class="btn" id="designFill">Подставить текст</button><label>Заголовок</label><textarea id="designTitle" rows="3"></textarea><label>Описание</label><textarea id="designBody" rows="5"></textarea><label>Дата</label><input id="designDate"><label>Загрузить фоновое фото</label><input type="file" accept="image/*" id="designFile"><label>Загрузить фоновое видео (MP4 / WebM)</label><input type="file" accept="video/mp4,video/webm,video/quicktime,video/*" id="designVideoFile"><label>Кадрирование фона — масштаб</label><input type="range" id="designCropZoom" min="1" max="3" step="0.01"><label>Сдвиг фона по горизонтали</label><input type="range" id="designCropX" min="-1500" max="1500" step="5"><label>Сдвиг фона по вертикали</label><input type="range" id="designCropY" min="-2200" max="2200" step="5"><button class="btn" id="designCropReset">Сбросить кадрирование</button><label>Длительность ролика (секунды)</label><input type="number" min="3" max="60" value="10" id="designDuration"><button class="btn" id="designClear">Убрать фото</button><label>Цвет фона</label><input type="color" id="designBg"><label>Акцентный цвет</label><input type="color" id="designAccent"><label>Размер заголовка</label><input type="number" min="20" max="130" step="0.5" id="designSize"><label>Логотип (PNG с прозрачностью)</label><input type="file" id="designLogoFile" accept="image/png,image/webp"><label>Размер описания</label><input type="number" min="15" max="70" step="0.25" id="designBodySize"><button class="btn" id="designReset">Сбросить положение текста</button><button class="btn" id="designResetAll" style="border-color:#b66;color:#ffb5b5">↺ Сбросить весь шаблон</button><button class="btn primary" id="designDownload">↓ Скачать PNG</button><button class="btn primary" id="designExportVideo">🎬 Скачать MP4</button><button class="btn" id="designCancelVideo" style="display:none">✕ Отменить экспорт</button><p class="muted mini" id="designNotice">Настройки сохраняются в этом браузере.</p></div><div class="design-stage"><canvas id="designCanvas" width="1080" height="1920"></canvas></div></div>';
let logoInput=document.getElementById('designLogoFile');if(logoInput)logoInput.onchange=e=>{let file=e.target.files[0];if(!file)return;let reader=new FileReader();reader.onload=()=>{designCfg.logo=reader.result;designLogoLoad(reader.result);designStore()};reader.readAsDataURL(file)};designLogoLoad(designCfg.logo);
for(const [id,key] of [['designCropZoom','cropZoom'],['designCropX','cropX'],['designCropY','cropY']]){let el=document.getElementById(id);el.value=s[key]??(key==='cropZoom'?1:0);el.oninput=()=>{s[key]=Number(el.value);designStore();designPaint()}}
document.getElementById('designCropReset').onclick=()=>{s.cropZoom=1;s.cropX=0;s.cropY=0;for(const [id,key] of [['designCropZoom','cropZoom'],['designCropX','cropX'],['designCropY','cropY']])document.getElementById(id).value=s[key];designStore();designPaint()};
let fields={designTitle:'title',designBody:'body',designDate:'date',designBg:'bg',designAccent:'accent',designSize:'size',designBodySize:'bodySize'};Object.keys(fields).forEach(id=>{let el=document.getElementById(id),key=fields[id];el.value=s[key];el.oninput=()=>{s[key]=el.type==='number'?Number(el.value):el.value;designStore();designPaint()}});
document.getElementById('designFill').onclick=()=>{let d=data.drafts.find(x=>x.id===document.getElementById('designDraft').value);if(!d)return;s.title=d.headline||'';s.body=(d.caption||'').replace(d.headline||'','').replace(/Источник:[\s\S]*/,'').trim().slice(0,600);s.date=designShortDate();designStore();renderDesign()};
document.getElementById('designClear').onclick=()=>{s.image='';if(designVideo){designVideo.pause();URL.revokeObjectURL(designVideo.src);designVideo=null}designImageLoad('');designStore()};
document.getElementById('designResetAll').onclick=()=>{
 if(designRecording){document.getElementById('designNotice').textContent='Сначала отмените экспорт видео.';return}
 if(!confirm('Сбросить все изменения шаблона? Удалятся тексты, загруженные фото, видео, свой логотип, кадрирование, цвета и размеры. Черновики новостей не затронутся.'))return;
 if(designVideo){designVideo.pause();URL.revokeObjectURL(designVideo.src);designVideo.src='';designVideo=null}
 designImg=null;designLogo=null;designDrag=null;
 try{localStorage.removeItem('daw_native_design')}catch(e){}
 designCfg={...DESIGN_DEFAULTS};
 renderDesign();
 document.getElementById('designNotice').textContent='Шаблон сброшен к стандартному виду. Черновики сохранены.';
};
document.getElementById('designReset').onclick=()=>{s.titleY=1130;s.bodyY=1302;s.size=40;s.bodySize=22;document.getElementById('designSize').value=s.size;document.getElementById('designBodySize').value=s.bodySize;designStore();designPaint()};
document.getElementById('designFile').onchange=e=>{let file=e.target.files[0];if(!file||!file.type.startsWith('image/'))return;let reader=new FileReader();reader.onload=()=>{let im=new Image();im.onload=()=>{let c=document.createElement('canvas'),k=Math.min(1,1600/Math.max(im.width,im.height));c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);s.image=c.toDataURL('image/jpeg',.72);designImageLoad(s.image);designStore()};im.src=reader.result};reader.readAsDataURL(file)};

document.getElementById('designVideoFile').onchange=e=>{
 const file=e.target.files[0];if(!file)return;
 if(designVideo){designVideo.pause();URL.revokeObjectURL(designVideo.src)}
 const v=document.createElement('video');v.muted=true;v.loop=true;v.playsInline=true;v.preload='auto';v.src=URL.createObjectURL(file);designVideo=v;
 v.onloadeddata=()=>{v.play().catch(()=>{});designPaint()};
 v.onerror=()=>{document.getElementById('designNotice').textContent='Не удалось прочитать видео'};
};
document.getElementById('designExportVideo').onclick=async()=>{
 const notice=document.getElementById('designNotice'),btn=document.getElementById('designExportVideo'),cancelBtn=document.getElementById('designCancelVideo');
 if(designRecording)return;
 if(!HTMLCanvasElement.prototype.captureStream||!window.MediaRecorder){notice.textContent='Этот браузер не поддерживает экспорт видео.';return}
 const duration=Math.min(60,Math.max(3,Number(document.getElementById('designDuration').value)||10));
 const cv=document.getElementById('designCanvas');
 const mime=['video/mp4;codecs="avc1.42E01E"','video/mp4;codecs=avc1','video/mp4'].find(t=>MediaRecorder.isTypeSupported(t));
 if(!mime){notice.textContent='Этот браузер не поддерживает прямой экспорт MP4.';return}
 let recorder,stream,frames=[],raf,timer,stopped=false,cancelled=false,resolveWait;
 const finishWait=()=>{if(resolveWait){let r=resolveWait;resolveWait=null;r()}};
 try{
  designRecording=true;btn.disabled=true;cancelBtn.style.display='';cancelBtn.disabled=false;
  designCancelExport=()=>{cancelled=true;notice.textContent='Отменяем экспорт…';cancelBtn.disabled=true;finishWait()};
  cancelBtn.onclick=()=>{if(designCancelExport)designCancelExport()};
  stream=cv.captureStream(30);
  recorder=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:5000000});
  recorder.ondataavailable=e=>{if(e.data.size&&!cancelled)frames.push(e.data)};
  const completed=new Promise((resolve,reject)=>{recorder.onstop=resolve;recorder.onerror=()=>reject(new Error('Ошибка записи'))});
  recorder.start(500);
  const started=performance.now();
  function tick(){if(cancelled)return;designPaint();if(designRecording)raf=requestAnimationFrame(tick)}
  tick();
  await new Promise(resolve=>{resolveWait=resolve;timer=setInterval(()=>{if(cancelled){finishWait();return}let elapsed=(performance.now()-started)/1000;notice.textContent='Создаём видео: '+Math.min(100,Math.round(elapsed/duration*100))+'%';if(elapsed>=duration)finishWait()},200)});
  clearInterval(timer);
  if(recorder.state!=='inactive'){recorder.stop();stopped=true}
  await completed;
  if(cancelled){notice.textContent='Экспорт отменён. Файл не сохранён.';return}
  const blob=new Blob(frames,{type:mime}),url=URL.createObjectURL(blob),link=document.createElement('a');
  link.href=url;link.download='theDAW-reels-'+Date.now()+'.mp4';link.click();setTimeout(()=>URL.revokeObjectURL(url),60000);
  notice.textContent='Видео готово! Сохранён MP4 (без звука).';
 }catch(err){notice.textContent=cancelled?'Экспорт отменён.': 'Ошибка экспорта: '+err.message}
 finally{
  clearInterval(timer);finishWait();designRecording=false;designCancelExport=null;btn.disabled=false;cancelBtn.style.display='none';cancelBtn.onclick=null;
  cancelAnimationFrame(raf);if(recorder&&recorder.state!=='inactive')try{recorder.stop()}catch(e){}
  if(stream)stream.getTracks().forEach(t=>t.stop());frames.length=0;designPaint();
 }
};

document.getElementById('designDownload').onclick=()=>{designPaint();let a=document.createElement('a');a.href=document.getElementById('designCanvas').toDataURL('image/png');a.download='theDAW-'+Date.now()+'.png';a.click()};
let cv=document.getElementById('designCanvas');cv.onpointerdown=e=>{let r=cv.getBoundingClientRect(),y=(e.clientY-r.top)/r.height*1920;designDrag=Math.abs(y-s.titleY)<Math.abs(y-s.bodyY)?'titleY':'bodyY';cv.setPointerCapture(e.pointerId)};cv.onpointermove=e=>{if(!designDrag)return;let r=cv.getBoundingClientRect();s[designDrag]=Math.round(Math.max(220,Math.min(1750,(e.clientY-r.top)/r.height*1920)));designPaint()};cv.onpointerup=()=>{designDrag=null;designStore()};cv.onpointercancel=()=>{designDrag=null;designStore()};
if(s.image)designImageLoad(s.image);else{designImg=null;designPaint()}
}
</script></body></html>
