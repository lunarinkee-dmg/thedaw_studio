<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#121315"><title>theDĀW Studio — demo</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:#f3f0e9;background:#111315;font-size:15px}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}a{color:#c8ff72}header{height:74px;padding:0 4%;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #2a2d2c;background:#151719}.logo{font-size:23px;font-weight:900;letter-spacing:-1.5px}.logo span{font-size:11px;letter-spacing:2px;color:#bdc3bc;margin-left:14px}.pill{background:#292e2b;border:1px solid #454b41;padding:7px 12px;border-radius:99px;font-size:11px;color:#c8ff72;font-weight:800;letter-spacing:1px}.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:calc(100vh - 74px)}nav{border-right:1px solid #2a2d2c;padding:27px 14px;background:#151719}nav button{display:flex;gap:13px;align-items:center;border:0;background:transparent;color:#afb5b0;padding:13px 15px;border-radius:11px;width:100%;text-align:left;margin:4px 0}nav button.active,nav button:hover{background:#2b3228;color:#d5ff95}nav .small{font-size:10px;letter-spacing:2px;color:#808b82;margin:21px 14px 9px}main{padding:38px 5%;max-width:1400px;width:100%;margin:auto}h1{font-size:clamp(28px,4vw,47px);margin:0 0 9px;letter-spacing:-2px}h2{font-size:22px;margin:0 0 15px}p.muted,.muted{color:#a1aaa1}p{line-height:1.65} .topline{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:27px}.controls{display:flex;gap:9px;flex-wrap:wrap}.btn{border:1px solid #495046;background:#272c29;color:#f4f4ec;border-radius:9px;padding:11px 16px;font-weight:700}.btn.primary{background:#d3ff86;color:#161b12;border-color:#d3ff86}.btn:hover{filter:brightness(1.11)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{border:1px solid #353936;background:#1c201f;border-radius:16px;padding:20px}.card h3{line-height:1.35;font-size:20px;margin:14px 0}.tag{color:#cfff84;text-transform:uppercase;letter-spacing:1.3px;font-size:10px;font-weight:800}.meta{font-size:12px;color:#9aa49b}.card .actions{display:flex;gap:7px;margin-top:20px;flex-wrap:wrap}input,textarea,select{background:#181b1a;color:#fff;border:1px solid #505951;border-radius:9px;padding:12px;width:100%}textarea{min-height:125px;resize:vertical}label{display:block;font-size:12px;font-weight:800;color:#c5cec3;margin:17px 0 8px}.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}.split{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(250px,.8fr);gap:20px}.stack{display:grid;gap:13px}.statrow{display:flex;gap:10px;flex-wrap:wrap}.stat{padding:14px 19px;border-radius:12px;background:#242a26;min-width:135px}.stat b{display:block;font-size:24px}.stat span{font-size:11px;color:#a5b0a5}.empty{padding:60px;text-align:center;color:#adb6ae;border:1px dashed #525952;border-radius:16px}.preview{width:100%;max-width:380px;aspect-ratio:4/5;margin:auto;background:radial-gradient(circle at 80% 18%,#729e55 0%,transparent 30%),linear-gradient(160deg,#39453c,#141615 58%,#222d23);border:1px solid #505b4c;display:flex;flex-direction:column;justify-content:space-between;padding:23px;overflow:hidden}.preview .brand{font-size:25px;font-weight:900;letter-spacing:-1px}.preview .headline{font-size:clamp(23px,3vw,39px);line-height:1.02;overflow-wrap:anywhere;font-weight:900;letter-spacing:-1.4px;text-transform:uppercase}.preview .foot{font-size:11px;letter-spacing:1px;color:#d4e4ce}.mediaitem{border:1px solid #434945;border-radius:12px;padding:15px;background:#252925}.mediaitem small{display:block;color:#acb3aa;margin-top:7px}.steps{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}.step{background:#252a26;border:1px solid #343a35;border-radius:90px;padding:8px 12px;color:#9ca69d;font-size:12px}.step.on{background:#32422c;border-color:#b8ed74;color:#dbffa8}.banner{padding:16px 20px;border:1px solid #5a694e;background:#273327;border-radius:12px;margin:17px 0;color:#d6e9d0}.danger{background:#3a2924;border-color:#795c51;color:#f0c7bb}footer{font-size:12px;color:#8a968b;margin-top:40px}.mini{font-size:12px}.link{color:#c8ff72} .hidden{display:none!important}@media(max-width:960px){.grid{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}}@media(max-width:670px){.app{display:block}nav{display:flex;overflow-x:auto;border-right:none;border-bottom:1px solid #2a2d2c;padding:7px}nav button{white-space:nowrap;font-size:12px}nav .small{display:none}main{padding:25px 17px}.grid,.two{grid-template-columns:1fr}.logo span{display:none}.card{padding:15px}}
</style></head><body><header><div class="logo">theDĀW<span>STUDIO / WORKSPACE</span></div><div class="pill">● LOCAL DEMO</div></header><div class="app"><nav><div class="small">WORKSPACE</div><button data-view="inbox" class="active">▦ &nbsp; Новости</button><button data-view="drafts">✎ &nbsp; Черновики</button><button data-view="media">▧ &nbsp; Медиатека</button><button data-view="design">◈ &nbsp; Дизайн</button><button data-view="publish">↗ &nbsp; Публикация</button><div class="small">SYSTEM</div><button data-view="settings">⚙ &nbsp; Подключения</button></nav><main id="main"></main></div><script>
const demoNews=[{id:'demo1',category:'Музыка',title:'Новый альбом: как превратить новость в публикацию',summary:'Это вымышленная новость для тестирования редакционного процесса. Подставьте реальный материал из вашего агрегатора.',source:'Демо theDĀW',url:'',date:'Пример'},{id:'demo2',category:'Кино',title:'Независимое кино Центральной Азии: редакционный пример',summary:'Тестовая карточка помогает проверить, как будет выглядеть публикация о кино.',source:'Демо theDĀW',url:'',date:'Пример'},{id:'demo3',category:'Культура',title:'Выставка современного искусства: пример материала',summary:'Вымышленный инфоповод для демонстрации карточек и шаблонов.',source:'Демо theDĀW',url:'',date:'Пример'}];
const K='thedaw_studio_demo_v1';let data;try{data=JSON.parse(localStorage.getItem(K))}catch{}if(!data||!Array.isArray(data.news))data={news:demoNews,drafts:[],media:[],published:[]};let view='inbox',current=null,filter='Все';const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>localStorage.setItem(K,JSON.stringify(data));const btn=(txt,fn,cls='')=>`<button class="btn ${cls}" onclick="${fn}">${txt}</button>`;const draft=()=>data.drafts.find(d=>d.id===current);const fmt=x=>x?esc(x):'—';function go(v){view=v;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));render()};document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.view));function create(id){const n=data.news.find(x=>x.id===id);const d={id:'d'+Date.now(),newsId:id,category:n.category,headline:n.title,caption:`${n.title}\n\n${n.summary}\n\nИсточник: ${n.source}${n.url?' — '+n.url:''}\n\n#theDAW`,tiktok:`${n.title}\n\n#theDAW`,template:'news',mediaId:'',status:'Черновик'};data.drafts.unshift(d);current=d.id;save();go('drafts')};function openDraft(id){current=id;go('drafts')};function addNews(){const title=prompt('Заголовок новости:');if(!title?.trim())return;const url=prompt('Ссылка на источник (необязательно):')||'';data.news.unshift({id:'n'+Date.now(),category:'Музыка',title:title.trim(),summary:'Добавлено вручную. Откройте редактор, чтобы подготовить публикацию.',source:'Добавлено редактором',url:url.trim(),date:new Date().toLocaleDateString('ru-RU')});save();render()};function update(field,value){const d=draft();if(!d)return;d[field]=value;save();if(field==='headline'||field==='template')document.querySelector('#designPreview')?.replaceChildren(makePreview(d))};function makePreview(d){const el=document.createElement('div');el.className='preview';el.style.background=d.template==='breaking'?'linear-gradient(155deg,#6f2525,#211617 64%)':d.template==='culture'?'linear-gradient(145deg,#857b65,#363a36 60%,#101310)':'';el.innerHTML=`<div class="brand">theDĀW.</div><div class="headline">${esc(d.headline)}</div><div class="foot">${esc(d.category.toUpperCase())} &nbsp; / &nbsp; DEMO PREVIEW</div>`;return el};function render(){const m=document.querySelector('#main');if(view==='inbox'){const cats=['Все',...new Set(data.news.map(x=>x.category))];m.innerHTML=`<div class="topline"><div><h1>Новости</h1><p class="muted">Редакционная лента. Новости загружаются автоматически из доступных RSS-лент. Проверяйте первоисточник.</p></div>${btn('+ Добавить новость','addNews()','primary')}</div><div class="controls" id="filters">${cats.map(c=>`<button class="btn ${filter===c?'primary':''}" onclick="filter=${JSON.stringify(c).replace(/"/g,'&quot;')};render()">${esc(c)}</button>`).join('')}</div><br><div class="grid">${data.news.filter(n=>filter==='Все'||n.category===filter).map(n=>`<article class="card"><span class="tag">${esc(n.category)}</span><h3>${esc(n.title)}</h3><p class="muted">${esc(n.summary)}</p><div class="meta">${esc(n.source)} · ${esc(n.date)}</div><div class="actions">${btn('Создать пост →',`create('${n.id}')`,'primary')}${n.url?`<a class="btn" href="${esc(n.url)}" rel="noopener noreferrer" target="_blank">Источник ↗</a>`:''}</div></article>`).join('')}</div>`;}
else if(view==='drafts'){const d=draft();m.innerHTML=`<div class="topline"><div><h1>Черновики</h1><p class="muted">Здесь редактор управляет текстами, визуалом и статусом.</p></div></div>${data.drafts.length?`<div class="controls">${data.drafts.map(x=>`<button class="btn ${x.id===current?'primary':''}" onclick="openDraft('${x.id}')">${esc(x.headline.slice(0,32))}</button>`).join('')}</div><br>`:''}${d?`<div class="split"><section class="card"><span class="tag">Текст публикации</span><label>Заголовок</label><input value="${esc(d.headline)}" oninput="update('headline',this.value)"><label>Instagram caption</label><textarea rows="9" oninput="update('caption',this.value)">${esc(d.caption)}</textarea><label>TikTok caption</label><textarea rows="4" oninput="update('tiktok',this.value)">${esc(d.tiktok)}</textarea><div class="banner">AI пока не подключён. Здесь можно вручную редактировать тексты. После подключения AI будет предлагать черновик на основе первоисточника.</div></section><section class="card"><span class="tag">Быстрый предпросмотр</span><div id="designPreview" style="margin-top:17px"></div><div class="actions" style="margin-top:17px">${btn('Выбрать дизайн →',"go('design')",'primary')}</div></section></div>`:`<div class="empty">Черновиков пока нет. Перейдите в «Новости» и нажмите «Создать пост».</div>`;if(d)document.querySelector('#designPreview').append(makePreview(d));}
else if(view==='media'){m.innerHTML=`<div class="topline"><div><h1>Медиатека</h1><p class="muted">Сохраняйте ссылки на исходные материалы и права использования.</p></div></div><div class="split"><div class="card"><h2>Добавить материал</h2><label>URL (TikTok, изображение, видео, пресс-кит)</label><input id="mediaUrl" placeholder="https://..."><label>Описание</label><input id="mediaLabel" placeholder="Например: видео с концерта"><label>Право на использование</label><select id="mediaRights"><option>Не проверено</option><option>Разрешение получено</option><option>Собственный материал</option><option>Открытая лицензия — проверить условия</option></select><br><br>${btn('Добавить ссылку','addMedia()','primary')}<p class="muted mini">На этом этапе сервис сохраняет ссылки, а не скачивает файлы. Автоматическая загрузка и поиск материалов появятся после подключения backend.</p></div><div class="card"><h2>Ваши материалы</h2><div class="stack">${data.media.length?data.media.map(x=>`<div class="mediaitem"><b>${esc(x.label)}</b><small>${esc(x.rights)}</small><a class="link mini" href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">Открыть источник ↗</a></div>`).join(''):'<p class="muted">Пока нет сохранённых ссылок.</p>'}</div></div></div>`;}
else if(view==='design'){const d=draft();m.innerHTML=`<h1>Дизайн</h1><p class="muted">Макет карточки для публикации. Настоящие шаблоны Canva подключим на следующем этапе.</p>${d?`<div class="split"><div class="card"><h2>Шаблон</h2><div class="stack">${[['news','News / стандарт'],['breaking','Breaking / срочное'],['culture','Culture / редакционный']].map(([v,l])=>`<label class="mediaitem" style="cursor:pointer;margin:0"><input type="radio" style="width:auto" name="tpl" ${d.template===v?'checked':''} onchange="update('template','${v}')"> &nbsp; ${l}</label>`).join('')}</div><div class="banner">Это локальный макет — он не является вашим реальным дизайном Canva. После авторизации заменим его фирменными шаблонами.</div></div><div class="card"><div id="designPreview"></div><br>${btn('К публикации →',"go('publish')",'primary')}</div></div>`:'<div class="empty">Сначала создайте черновик из новости.</div>' ;if(d)document.querySelector('#designPreview').append(makePreview(d));}
else if(view==='publish'){const d=draft();m.innerHTML=`<h1>Публикация</h1><p class="muted">Последняя проверка перед выходом в соцсети.</p>${d?`<div class="split"><div class="card"><h2>Проверка</h2><div class="steps"><span class="step on">✓ Текст</span><span class="step on">✓ Макет демо</span><span class="step">• Canva</span><span class="step">• API соцсетей</span></div><p><b>${esc(d.headline)}</b></p><p class="muted">${esc(d.caption)}</p><div class="banner danger">Настоящая публикация пока недоступна — Instagram и TikTok не подключены. Кнопка ниже сохраняет только локальный статус «Готово к публикации».</div>${btn(d.status==='Готово к публикации'?'✓ Готово к публикации':'Отметить как готовое',"markReady()",'primary')}</div><div class="card"><div id="designPreview"></div></div></div>`:'<div class="empty">Выберите черновик, чтобы подготовить публикацию.</div>'};if(d)document.querySelector('#designPreview').append(makePreview(d));}
else if(view==='settings'){m.innerHTML=`<h1>Подключения</h1><p class="muted">Панель готова к будущим интеграциям. Пока ничего не подключено.</p><div class="grid">${[['Telegram','Получение новостей от вашего бота'],['AI','Автоматическое написание текстов'],['Canva Pro','Заполнение ваших фирменных шаблонов'],['Instagram','Публикация через Meta API'],['TikTok','Публикация через Content Posting API'],['TikTok media','Получение разрешённых медиа по ссылке']].map(([a,b])=>`<div class="card"><span class="tag">Не подключено</span><h3>${a}</h3><p class="muted">${b}</p></div>`).join('')}</div><br>${btn('Сбросить демо-данные','resetDemo()')}`;}m.insertAdjacentHTML('beforeend','<footer>theDĀW Studio · v0.1 · Демо работает локально в вашем браузере; данные сохраняются только на этом устройстве. Никаких реальных публикаций не происходит.</footer>')};function addMedia(){const u=document.querySelector('#mediaUrl').value.trim(),label=document.querySelector('#mediaLabel').value.trim(),rights=document.querySelector('#mediaRights').value;if(!/^https?:\/\//i.test(u)){alert('Вставьте ссылку, начинающуюся с https://');return}data.media.unshift({id:'m'+Date.now(),url:u,label:label||'Материал',rights});save();render()};function markReady(){const d=draft();if(d){d.status='Готово к публикации';save();render()}}async function loadLiveNews(){
 try{
  const response=await fetch('./news.json?t='+Date.now(),{cache:'no-store'});
  if(!response.ok)throw new Error('HTTP '+response.status);
  const incoming=await response.json();
  if(!Array.isArray(incoming))throw new Error('Invalid feed');
  const local=data.news.filter(x=>!String(x.id).startsWith('rss') && !String(x.id).startsWith('demo'));
  data.news=[...incoming,...local.filter(x=>!incoming.some(y=>y.url===x.url))];
  save(); if(view==='inbox')render();
 }catch(err){console.warn('News feed unavailable',err);}
}
function resetDemo(){if(confirm('Удалить все локальные изменения и вернуть демонстрационные новости?')){localStorage.removeItem(K);location.reload()}}render();loadLiveNews();
</script></body></html>
