
<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#333333">
<title>theDĀW Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,900;1,400&display=swap" rel="stylesheet">
<style>
:root {
  font-family: Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif;
  color:#e8e8e8;
  background:#333333;
  font-size:15px;
}
*{box-sizing:border-box}
body{margin:0}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
a{color:#e8e8e8}
header{
  height:74px;
  padding:0 4%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid #575757;
  background:#333333;
}
.logo{font-size:23px;font-weight:900;letter-spacing:-1.5px}
.logo span{
  font-size:11px;
  letter-spacing:2px;
  color:#c5c5c5;
  margin-left:14px;
}
.pill{
  background:#404040;
  border:1px solid #626262;
  padding:7px 12px;
  border-radius:99px;
  font-size:11px;
  color:#e8e8e8;
  font-weight:800;
}
.app{
  display:grid;
  grid-template-columns:220px minmax(0,1fr);
  min-height:calc(100vh - 74px);
}
nav{
  border-right:1px solid #575757;
  padding:27px 14px;
  background:#333333;
}
nav button{
  display:flex;
  gap:13px;
  align-items:center;
  border:0;
  background:transparent;
  color:#d0d0d0;
  padding:13px 15px;
  border-radius:11px;
  width:100%;
  text-align:left;
  margin:4px 0;
}
nav button.active,nav button:hover{
  background:#494949;
  color:#ffffff;
}
nav .small{
  font-size:10px;
  letter-spacing:2px;
  color:#aaaaaa;
  margin:21px 14px 9px;
}
main{
  padding:38px 5%;
  max-width:1400px;
  width:100%;
  margin:auto;
}
h1{
  font-size:clamp(28px,4vw,47px);
  margin:0 0 9px;
  letter-spacing:-2px;
}
h2{font-size:22px;margin:0 0 15px}
p{line-height:1.65}
.muted{color:#bcbcbc}
.topline{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  flex-wrap:wrap;
  margin-bottom:27px;
}
.btn{
  border:1px solid #707070;
  background:#424242;
  color:#e8e8e8;
  border-radius:9px;
  padding:11px 16px;
  font-weight:700;
}
.btn.primary{
  background:#e8e8e8;
  color:#333333;
  border-color:#e8e8e8;
}
.btn:hover{filter:brightness(1.11)}
.grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:14px;
}
.card{
  border:1px solid #606060;
  background:#3c3c3c;
  border-radius:16px;
  padding:20px;
}
.card h3{
  line-height:1.35;
  font-size:20px;
  margin:14px 0;
}
.card .actions{
  display:flex;
  gap:7px;
  margin-top:20px;
  flex-wrap:wrap;
}
input,textarea,select{
  background:#383838;
  color:#e8e8e8;
  border:1px solid #727272;
  border-radius:9px;
  padding:12px;
  width:100%;
}
textarea{min-height:125px;resize:vertical}
label{
  display:block;
  font-size:12px;
  font-weight:800;
  color:#d0d0d0;
  margin:17px 0 8px;
}
.tag{
  color:#e8e8e8;
  text-transform:uppercase;
  letter-spacing:1.3px;
  font-size:10px;
  font-weight:800;
}
.meta{font-size:12px;color:#bcbcbc}
.mini{font-size:12px}
.banner{
  padding:16px 20px;
  border:1px solid #858585;
  background:#484848;
  border-radius:12px;
  margin:17px 0;
  color:#e8e8e8;
}
.danger{
  background:#543b3b;
  border-color:#9c7373;
  color:#f0c7bb;
}

/* Monochrome editorial system */
:root{color-scheme:dark}
::selection{background:#e8e8e8;color:#333333}
:focus-visible{outline:2px solid #e8e8e8;outline-offset:3px}
.btn,.card,nav button,.news-edge-arrow{transition:background-color .18s ease,border-color .18s ease,transform .18s ease}
.btn:hover:not(:disabled){background:#555555;filter:none}
.btn.primary:hover:not(:disabled){background:#ffffff;color:#333333}
.card:hover{border-color:#898989}
nav button.active{font-weight:800;border-left:2px solid #e8e8e8}
input:focus,textarea:focus,select:focus{border-color:#e8e8e8;outline:none}

/* НОВОСТИ */
.news-heading{margin-bottom:18px}
.news-heading h1{font-size:clamp(28px,3vw,42px)}
.news-heading p{margin:5px 0 0;font-size:13px}
.news-grid{
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:12px;
}
.news-card{
  padding:15px 17px;
  border-radius:13px;
  display:flex;
  flex-direction:column;
  min-width:0;
}
.news-card h3{
  font-size:clamp(15px,1.08vw,18px);
  line-height:1.27;
  margin:9px 0 7px;
  display:-webkit-box;
  -webkit-box-orient:vertical;
  -webkit-line-clamp:3;
  line-clamp:3;
  overflow:hidden;
}
.news-summary{
  display:-webkit-box;
  -webkit-box-orient:vertical;
  -webkit-line-clamp:3;
  line-clamp:3;
  overflow:hidden;
  font-size:12.5px;
  line-height:1.4;
  max-height:4.2em;
  margin:0 0 10px;
}
.news-meta{font-size:11px;margin-top:auto}
.news-card .actions{margin-top:10px;gap:6px}
.news-card .actions .btn{
  font-size:11.5px;
  padding:8px 10px;
  white-space:nowrap;
}
.news-carousel{
  display:grid;
  grid-template-columns:36px minmax(0,1fr) 36px;
  gap:12px;
  align-items:center;
}
.news-carousel>.news-grid{
  grid-column:2;
  grid-row:1;
}
.news-edge-arrow{
  width:36px;
  height:60px;
  border:1px solid #626262;
  border-radius:9px;
  background:#404040;
  color:#e8e8e8;
  font-size:39px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.news-edge-arrow:disabled{opacity:.24}
.news-edge-left{grid-column:1;grid-row:1}
.news-edge-right{grid-column:3;grid-row:1}
.news-pagination{
  display:flex;
  justify-content:center;
  align-items:center;
  margin:14px 0;
}
.news-page-numbers{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
}
.news-page-numbers .btn{
  border:0;
  background:transparent;
  padding:4px 6px;
  color:#c3c3c3;
}
.news-page-numbers .selected{
  color:#e8e8e8;
  text-decoration:underline;
  text-underline-offset:5px;
}
.news-page-ellipsis{color:#bcbcbc}

/* ДИЗАЙН */
.design-layout{
  display:grid;
  grid-template-columns:minmax(270px,400px) minmax(270px,1fr);
  gap:22px;
  align-items:start;
}
.design-form{display:grid;gap:12px}
.design-form label{margin:0}
.design-stage{
  display:flex;
  justify-content:center;
  background:#424242;
  padding:16px;
  border-radius:15px;
}
#designCanvas{
  width:100%;
  max-width:410px;
  aspect-ratio:9/16;
  touch-action:none;
  cursor:grab;
}
@media(max-width:1000px){
  .news-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:800px){
  .design-layout{grid-template-columns:1fr}
  .design-stage{order:-1}
  #designCanvas{max-width:330px}
}
@media(max-width:670px){
  .app{display:block}
  nav{
    display:flex;
    overflow-x:auto;
    border-right:none;
    border-bottom:1px solid #575757;
    padding:7px;
  }
  nav button{white-space:nowrap;font-size:12px}
  nav .small{display:none}
  main{padding:25px 17px}
  .grid,.news-grid{grid-template-columns:1fr}
  .logo span{display:none}
  .card{padding:15px}
  .news-carousel{
    grid-template-columns:28px minmax(0,1fr) 28px;
    gap:5px;
  }
  .news-edge-arrow{width:28px;height:48px;font-size:30px}
  .news-page-numbers{gap:5px}
}

/* Scroll design settings separately from preview */
@media(min-width:801px){.design-layout{align-items:start}.design-form{max-height:calc(100vh - 185px);overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#777777 #3c3c3c}.design-stage{position:sticky;top:18px;max-height:calc(100vh - 110px);overflow:hidden}.design-stage canvas{max-height:calc(100vh - 145px);width:auto;max-width:100%;height:auto}}
.design-toggle-row{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:11px 0;margin:4px 0}.design-toggle-row input{width:43px;height:23px;accent-color:#e8e8e8;cursor:pointer}
</style>
</head>
<body>

<header>
  <div class="logo">theDĀW<span>STUDIO / WORKSPACE</span></div>
  <div class="pill">● LOCAL DEMO</div>
</header>

<div class="app">
<nav>
  <div class="small">WORKSPACE</div>
  <button data-view="inbox" class="active">▦ &nbsp; Новости</button>
  <button data-view="drafts">✎ &nbsp; Черновики</button>
  <button data-view="media">▧ &nbsp; Медиатека</button>
  <button data-view="design">◈ &nbsp; Дизайн</button>
  <button data-view="publish">↗ &nbsp; Публикация</button>
  <div class="small">SYSTEM</div>
  <button data-view="settings">⚙ &nbsp; Настройки</button>
</nav>
<main id="main"></main>
</div>

<script>
const K='thedaw_studio_v02';
let saved={};
try {
  saved=JSON.parse(localStorage.getItem(K))||{};
} catch(e){}

let data={
  news:[],
  drafts:saved.drafts||[],
  media:saved.media||[]
};

let view='inbox';
let current=null;
let newsPage=1;
let newsLoading=false;
let newsError='';

const esc=x=>String(x??'').replace(
  /[&<>"']/g,
  c=>({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[c])
);

function tiktokSearchUrl(title){
  const query=String(title||'').replace(/\s+/g,' ').trim().slice(0,130);
  return 'https://www.tiktok.com/search/video?q='+encodeURIComponent(query);
}

const save=()=>localStorage.setItem(
  K,
  JSON.stringify({
    drafts:data.drafts,
    media:data.media
  })
);

function go(v){
  view=v;
  document.querySelectorAll('nav button').forEach(
    b=>b.classList.toggle('active',b.dataset.view===v)
  );
  render();
}

document.querySelectorAll('nav button').forEach(
  b=>b.onclick=()=>go(b.dataset.view)
);

function create(id){
  let n=data.news.find(x=>x.id===id);
  if(!n)return;

  let d={
    id:'d'+Date.now(),
    sourceUrl:n.url,
    sourceTitle:n.title,
    sourceSummary:n.summary,
    originalTitle:n.title,
    originalSummary:n.summary,
    sourceName:n.source,
    headline:n.title,
    caption:(n.title)+'\n\n'+(n.summary)+
      '\n\nИсточник: '+n.source+' — '+n.url,
    tiktok:n.title,
    category:n.category
  };

  data.drafts.unshift(d);
  current=d.id;
  save();
  go('drafts');
}

function update(k,v){
  let d=data.drafts.find(x=>x.id===current);
  if(d){
    d[k]=v;
    save();
  }
}

function newsTimestamp(n){
  const raw=String(
    n.date||n.published||n.pubDate||''
  ).trim();

  const ru=raw.match(
    /^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})(?:\s+(\d{1,2}):(\d{2}))?/
  );

  if(ru){
    const d=new Date(
      Number(ru[3]),
      Number(ru[2])-1,
      Number(ru[1]),
      Number(ru[4]||0),
      Number(ru[5]||0)
    );

    return d.getFullYear()===Number(ru[3]) &&
      d.getMonth()===Number(ru[2])-1 &&
      d.getDate()===Number(ru[1])
      ?d.getTime():NaN;
  }

  return Date.parse(raw);
}

function recentNews(items){
  const now=Date.now();
  const cutoff=now-2*24*60*60*1000;

  return items.filter(n=>{
    const t=newsTimestamp(n);
    return Number.isFinite(t) &&
      t>=cutoff &&
      t<=now+5*60*1000;
  });
}

function render(){
  if(view==='design'){
    renderDesign();
    return;
  }

  const m=document.getElementById('main');
  if(!m)return;

  if(view==='inbox'){
    const sorted=recentNews(data.news).sort(
      (a,b)=>newsTimestamp(b)-newsTimestamp(a)
    );

    const pages=Math.max(
      1,
      Math.ceil(sorted.length/6)
    );

    newsPage=Math.max(
      1,
      Math.min(newsPage,pages)
    );

    const visible=sorted.slice(
      (newsPage-1)*6,
      newsPage*6
    );

    m.innerHTML=
      '<section class="news-view">'+
      '<div class="topline news-heading">'+
      '<div><h1>Новости</h1>'+
      '<p class="muted">Свежие новости первыми · '+
      sorted.length+
      ' материалов за последние 48 часов</p></div>'+
      '<button class="btn primary" id="newsRefresh" '+
      (newsLoading?'disabled':'')+'>'+
      (newsLoading?'⏳ Обновляем…':'↻ Обновить новости')+
      '</button></div>'+
      (newsError?
        '<p class="banner danger">'+esc(newsError)+'</p>':'')+
      '<div class="news-carousel">'+
      '<button class="news-edge-arrow news-edge-left" '+
      'data-news-page="'+(newsPage-1)+'" '+
      (newsPage===1?'disabled':'')+'>‹</button>'+
      '<div class="grid news-grid">'+
      (visible.length?
        visible.map(n=>
          '<article class="card news-card">'+
          '<span class="tag">'+esc(n.category)+'</span>'+
          '<h3 title="'+esc(n.title)+'">'+esc(n.title)+'</h3>'+
          '<p class="muted news-summary">'+esc(n.summary)+'</p>'+
          '<div class="meta news-meta">'+
          esc(n.source)+' · '+esc(n.date)+
          '</div><div class="actions">'+
          '<button class="btn primary" data-create="'+
          esc(n.id)+'">Создать пост →</button>'+
          '<a class="btn" href="'+esc(tiktokSearchUrl(n.title))+
          '" target="_blank" rel="noopener noreferrer" title="Найти видео по теме новости в TikTok">'+
          '♫ Видео TikTok ↗</a>'+
          '<a class="btn" href="'+esc(n.url)+
          '" target="_blank" rel="noopener noreferrer">'+
          'Источник ↗</a></div></article>'
        ).join(''):
        '<p class="muted">'+
        (newsLoading?'Загружаем новости…':'Новостей пока нет.')+
        '</p>')+
      '</div>'+
      '<button class="news-edge-arrow news-edge-right" '+
      'data-news-page="'+(newsPage+1)+'" '+
      (newsPage===pages?'disabled':'')+'>›</button>'+
      '</div>'+
      (pages>1?
        '<div class="news-pagination">'+
        '<div class="news-page-numbers">'+
        Array.from({length:pages},(_,i)=>i+1)
          .filter(p=>
            p===1||p===pages||Math.abs(p-newsPage)<=2
          )
          .reduce((acc,p,i,arr)=>{
            if(i&&p-arr[i-1]>1){
              acc.push('<span class="news-page-ellipsis">…</span>');
            }
            acc.push(
              '<button class="btn '+
              (p===newsPage?'selected':'')+
              '" data-news-page="'+p+'">'+p+'</button>'
            );
            return acc;
          },[]).join('')+
        '</div></div>':'')+
      '</section>';

    m.querySelectorAll('[data-create]').forEach(
      b=>b.onclick=()=>create(b.dataset.create)
    );

    m.querySelectorAll('[data-news-page]').forEach(
      b=>b.onclick=()=>{
        newsPage=Number(b.dataset.newsPage);
        render();
        document.querySelector('main').scrollIntoView({
          behavior:'smooth',
          block:'start'
        });
      }
    );

    m.querySelector('#newsRefresh').onclick=()=>load(true);

  } else if(view==='drafts'){

    m.innerHTML=
      '<h1>Черновики</h1>'+
      data.drafts.map(d=>
        '<div class="card">'+
        '<h3>'+esc(d.headline)+'</h3>'+
        '<div class="actions">'+
        '<button class="btn primary" data-ai="'+
        esc(d.id)+'">✎ Подготовить текст</button>'+
        '<a class="btn" href="https://www.canva.com/design/DAHXQ4rCB5s/erMvoEWYI_CoRN9gxyI7LQ/edit" '+
        'target="_blank" rel="noopener noreferrer">'+
        '◈ Открыть шаблон Canva ↗</a>'+
        '</div>'+
        '<p class="muted" id="status-'+esc(d.id)+'"></p>'+
        '<label>Заголовок</label>'+
        '<input data-id="'+esc(d.id)+
        '" data-field="headline" value="'+esc(d.headline)+'">'+
        '<label>Instagram</label>'+
        '<textarea data-id="'+esc(d.id)+
        '" data-field="caption" rows="6">'+
        esc(d.caption)+'</textarea>'+
        '<label>TikTok</label>'+
        '<textarea data-id="'+esc(d.id)+
        '" data-field="tiktok" rows="3">'+
        esc(d.tiktok)+'</textarea></div>'
      ).join('');

    m.querySelectorAll('[data-ai]').forEach(
      b=>b.onclick=()=>generateAI(b.dataset.ai)
    );

    m.querySelectorAll('[data-field]').forEach(el=>{
      el.oninput=()=>{
        let d=data.drafts.find(x=>x.id===el.dataset.id);
        if(d){
          d[el.dataset.field]=el.value;
          save();
        }
      };
    });

  } else if(view==='media'){

    m.innerHTML=
      '<h1>Медиатека</h1>'+
      '<p class="muted">Пока сохраняем ссылки, не скачиваем видео.</p>'+
      '<input id="mediaUrl" placeholder="Ссылка на TikTok или медиа">'+
      '<button class="btn primary" id="addMedia">Сохранить ссылку</button>'+
      data.media.map(x=>
        '<div class="card"><a href="'+esc(x)+
        '" target="_blank">'+esc(x)+'</a></div>'
      ).join('');

    m.querySelector('#addMedia').onclick=()=>{
      let u=m.querySelector('#mediaUrl').value;
      if(/^https?:\/\//.test(u)){
        data.media.unshift(u);
        save();
        render();
      }
    };

  } else if(view==='settings'){
    m.innerHTML='<h1>Настройки</h1><div class="card"><h3>Версия без Cloudflare</h3>'+
      '<p class="muted">Новости обновляются через GitHub Actions. Черновики хранятся в этом браузере. '+
      'Для публикации скачай PNG или MP4 и загрузи в Instagram вручную.</p>'+
      '<button class="btn primary" id="exportDrafts">Скачать копию черновиков</button></div>';
    m.querySelector('#exportDrafts').onclick=()=>{
      const blob=new Blob([JSON.stringify({drafts:data.drafts,media:data.media},null,2)],{type:'application/json'});
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');a.href=url;a.download='thedaw-drafts-backup.json';a.click();
      setTimeout(()=>URL.revokeObjectURL(url),1000);
    };

  } else {

    m.innerHTML=
      '<h1>Публикация</h1>'+
      '<div class="card"><p class="muted">'+
      'Для публикации Reels открой вкладку «Дизайн».'+
      '</p></div>';
  }
}

async function load(manual=false){
  if(newsLoading)return;

  newsLoading=true;
  newsError='';

  if(view==='inbox')render();

  try{
    const r=await fetch(
      './news.json?v='+Date.now(),
      {cache:'no-store'}
    );

    if(!r.ok)throw Error('HTTP '+r.status);

    const n=await r.json();

    if(!Array.isArray(n)){
      throw Error('Неверный формат');
    }

    data.news=recentNews(n);

    if(manual)newsPage=1;

  }catch(e){
    newsError='Не удалось обновить новости: '+e.message;
  }finally{
    newsLoading=false;
    if(view==='inbox')render();
  }
}

function generateAI(id){
  const d=data.drafts.find(x=>x.id===id);
  if(!d)return;
  const title=d.headline||d.sourceTitle||'';
  d.caption=title+'\\n\\n'+(d.sourceSummary||'')+'\\n\\nИсточник: '+(d.sourceName||'')+' — '+(d.sourceUrl||'');
  d.tiktok=title;
  save();render();
}

render();
load();
</script>

<script>
const DESIGN_DEFAULTS={
  title:'',
  body:'',
  date:'',
  bg:'#181d1b',
  accent:'#d3ff86',
  size:40,
  bodySize:22,
  titleY:1130,
  bodyY:1302,
  image:'',
  logo:'',
  cropZoom:1,
  cropX:0,
  cropY:0,
  gradient:true
};

let designCfg={...DESIGN_DEFAULTS};
let designImg=null;
let designDrag=null;
let designVideo=null;
let designMusic=null;
let designLogo=null;
let designRecording=false;
let designCancelExport=null;


try{
  Object.assign(
    designCfg,
    JSON.parse(localStorage.getItem('daw_native_design')||'{}')
  );
}catch(e){}

function designStore(){
  try{
    localStorage.setItem(
      'daw_native_design',
      JSON.stringify(designCfg)
    );
  }catch(e){
    let x=document.getElementById('designNotice');
    if(x){
      x.textContent='Фотография слишком большая для хранения в браузере. Скачай PNG.';
    }
  }
}

function designWrap(ctx,txt,x,y,width,size,lines,style='title'){
  const title=style==='title';
  const tracking=title?-.022*size:-.011*size;
  const leading=title?1.12:1.22;

  ctx.font=title
    ?'900 '+size+'px Montserrat,Arial,sans-serif'
    :'italic 400 '+size+'px Montserrat,Arial,sans-serif';

  const measure=t=>{
    let w=0;
    for(const ch of t){
      w+=ctx.measureText(ch).width+tracking;
    }
    return w;
  };

  let words=String(txt||'').split(/\s+/);
  let rows=[];
  let line='';

  for(const word of words){
    let next=line?line+' '+word:word;
    if(measure(next)>width&&line){
      rows.push(line);
      line=word;
    }else{
      line=next;
    }
  }

  rows.push(line);

  rows.slice(0,lines).forEach((t,i)=>{
    let xx=x;
    for(const ch of t){
      ctx.fillText(ch,xx,y+i*size*leading);
      xx+=ctx.measureText(ch).width+tracking;
    }
  });
}

function designPaint(){
  const cv=document.getElementById('designCanvas');
  if(!cv)return;

  const ctx=cv.getContext('2d');
  const s=designCfg;

  ctx.fillStyle=s.bg;
  ctx.fillRect(0,0,1080,1920);

  const media=
    designVideo&&designVideo.readyState>=2
      ?designVideo
      :designImg;

  if(media){
    const mw=media.videoWidth||media.width;
    const mh=media.videoHeight||media.height;

    if(mw>0&&mh>0){
      const k=Math.max(1080/mw,1920/mh)*
        Math.max(1,Number(s.cropZoom)||1);

      const w=mw*k;
      const h=mh*k;

      const dx=(1080-w)/2+(Number(s.cropX)||0);
      const dy=(1920-h)/2+(Number(s.cropY)||0);

      ctx.save();
      ctx.beginPath();
      ctx.rect(0,0,1080,1920);
      ctx.clip();
      ctx.drawImage(media,dx,dy,w,h);
      ctx.restore();
    }
  }

  if(s.gradient!==false){
  let top=ctx.createLinearGradient(0,0,0,520);
  top.addColorStop(0,'rgba(0,0,0,.55)');
  top.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=top;ctx.fillRect(0,0,1080,520);
  let bottom=ctx.createLinearGradient(0,670,0,1920);
  bottom.addColorStop(0,'rgba(0,0,0,0)');
  bottom.addColorStop(.5,'rgba(0,0,0,.42)');
  bottom.addColorStop(1,'rgba(0,0,0,.84)');
  ctx.fillStyle=bottom;ctx.fillRect(0,670,1080,1250);
  }

  ctx.textBaseline='top';
  ctx.fillStyle='#fff';

  if(
    designLogo&&
    designLogo.complete&&
    designLogo.naturalWidth
  ){
    ctx.drawImage(designLogo,108,106,84,129);
  }

  ctx.font='400 28.5px Arial,sans-serif';
  ctx.textAlign='right';
  ctx.fillText(s.date||designShortDate(),970,155);
  ctx.textAlign='left';

  ctx.fillStyle='#fff';

  designWrap(
    ctx,
    s.title||'ЗАГОЛОВОК НОВОСТИ',
    108,
    s.titleY,
    862,
    +s.size,
    5
  );

  ctx.fillStyle='#f3f3f3';

  designWrap(
    ctx,
    s.body||'Описание новости',
    108,
    s.bodyY,
    800,
    +s.bodySize,
    9,
    'body'
  );
}

function designLogoLoad(src){
  src=src||'assets/thedaw-logo.svg';

  let im=new Image();

  im.onload=()=>{
    designLogo=im;
    designPaint();
  };

  im.src=src;
}

function designImageLoad(src){
  if(!src){
    designImg=null;
    designPaint();
    return;
  }

  let im=new Image();

  im.onload=()=>{
    designImg=im;
    designPaint();
  };

  im.src=src;
}

function designShortDate(){
  const d=new Date();

  return String(d.getDate()).padStart(2,'0')+
    '/'+String(d.getMonth()+1).padStart(2,'0');
}

function renderDesign(){
  const m=document.getElementById('main');
  const s=designCfg;

  if(!m)return;

  m.innerHTML=`
    <h1>Дизайн theDĀW</h1>
    <div class="design-layout">
      <div class="card design-form" id="designSettings">

        <label>Подставить новость из черновиков</label>
        <select id="designDraft">
          <option value="">Выбери черновик</option>
          ${data.drafts.map(d=>
            '<option value="'+esc(d.id)+'">'+
            esc(d.headline)+'</option>'
          ).join('')}
        </select>

        <button class="btn" id="designFill">
          Подставить текст
        </button>

        <label>Заголовок</label>
        <textarea id="designTitle" rows="3"></textarea>

        <label>Описание</label>
        <textarea id="designBody" rows="5"></textarea>

        <label>Дата</label>
        <input id="designDate">

        <label>Фоновое медиа (фото или видео)</label>
        <input type="file" accept="image/*,video/*" id="designMediaFile">
        <label class="design-toggle-row" for="designGradient"><span>Градиент сверху и снизу</span><input type="checkbox" id="designGradient"></label>

        <label>Добавить музыку (MP3 / M4A / WAV)</label>
        <input type="file" accept="audio/*" id="designMusicFile">
        <button class="btn" id="designRemoveMusic">Убрать музыку</button>
        <label>Громкость исходного видео</label>
        <input type="range" id="designOriginalVolume" min="0" max="100" value="100">
        <label>Громкость музыки</label>
        <input type="range" id="designMusicVolume" min="0" max="100" value="70">
        <label>Кадрирование фона — масштаб</label>
        <input type="range"
          id="designCropZoom" min="1" max="3" step="0.01">

        <label>Сдвиг фона по горизонтали</label>
        <input type="range"
          id="designCropX" min="-1500" max="1500" step="5">

        <label>Сдвиг фона по вертикали</label>
        <input type="range"
          id="designCropY" min="-2200" max="2200" step="5">

        <button class="btn" id="designCropReset">
          Сбросить кадрирование
        </button>

        <label>Длительность ролика (секунды)</label>
        <input type="number"
          min="3" max="60" value="10" id="designDuration">

        <button class="btn" id="designClear">
          Убрать фото
        </button>

        <label>Размер заголовка</label>
        <input type="number"
          min="20" max="130" step="0.5" id="designSize">

        <label>Логотип (PNG с прозрачностью)</label>
        <input type="file"
          id="designLogoFile" accept="image/png,image/webp">

        <label>Размер описания</label>
        <input type="number"
          min="15" max="70" step="0.25" id="designBodySize">

        <button class="btn" id="designReset">
          Сбросить положение текста
        </button>

        <button class="btn" id="designResetAll"
          style="border-color:#b66;color:#ffb5b5">
          ↺ Сбросить весь шаблон
        </button>

        <button class="btn primary" id="designDownload">
          ↓ Скачать PNG
        </button>

        <button class="btn primary" id="designExportVideo">
          🎬 Скачать MP4
        </button>

        <label>Подпись для Instagram Reels</label>
        <textarea id="designInstagramCaption"
          rows="4"
          placeholder="Текст публикации"></textarea>

        <button class="btn" id="designCancelVideo"
          style="display:none">
          ✕ Отменить экспорт
        </button>

        <p class="muted mini" id="designNotice">
          Настройки сохраняются в этом браузере.
        </p>

      </div>

      <div class="design-stage">
        <canvas id="designCanvas"
          width="1080" height="1920"></canvas>
      </div>
    </div>
  `;

  const logoInput=document.getElementById('designLogoFile');

  if(logoInput){
    logoInput.onchange=e=>{
      let file=e.target.files[0];
      if(!file)return;

      let reader=new FileReader();

      reader.onload=()=>{
        designCfg.logo=reader.result;
        designLogoLoad(reader.result);
        designStore();
      };

      reader.readAsDataURL(file);
    };
  }

  designLogoLoad(designCfg.logo);
  const gradientToggle=document.getElementById('designGradient');
  gradientToggle.checked=s.gradient!==false;
  gradientToggle.onchange=()=>{s.gradient=gradientToggle.checked;designStore();designPaint()};
  document.getElementById('designMusicFile').onchange=e=>{
    const f=e.target.files[0]; if(!f)return;
    if(designMusic){designMusic.pause();URL.revokeObjectURL(designMusic.src);}
    designMusic=new Audio(URL.createObjectURL(f));
    designMusic.loop=true;
    designMusic.preload='auto';
    document.getElementById('designNotice').textContent='Музыка загружена: '+f.name;
  };
  document.getElementById('designRemoveMusic').onclick=()=>{
    if(designMusic){designMusic.pause();URL.revokeObjectURL(designMusic.src);designMusic=null;}
    document.getElementById('designMusicFile').value='';
    document.getElementById('designNotice').textContent='Музыка удалена';
  };

  for(const [id,key] of [
    ['designCropZoom','cropZoom'],
    ['designCropX','cropX'],
    ['designCropY','cropY']
  ]){
    let el=document.getElementById(id);

    el.value=s[key]??(key==='cropZoom'?1:0);

    el.oninput=()=>{
      s[key]=Number(el.value);
      designStore();
      designPaint();
    };
  }

  document.getElementById('designCropReset').onclick=()=>{
    s.cropZoom=1;
    s.cropX=0;
    s.cropY=0;

    for(const [id,key] of [
      ['designCropZoom','cropZoom'],
      ['designCropX','cropX'],
      ['designCropY','cropY']
    ]){
      document.getElementById(id).value=s[key];
    }

    designStore();
    designPaint();
  };

  let fields={
    designTitle:'title',
    designBody:'body',
    designDate:'date',
    designSize:'size',
    designBodySize:'bodySize'
  };

  Object.keys(fields).forEach(id=>{
    let el=document.getElementById(id);
    let key=fields[id];

    el.value=s[key];

    el.oninput=()=>{
      s[key]=el.type==='number'
        ?Number(el.value)
        :el.value;

      designStore();
      designPaint();
    };
  });

  document.getElementById('designFill').onclick=()=>{
    let d=data.drafts.find(
      x=>x.id===document.getElementById('designDraft').value
    );

    if(!d)return;

    s.title=d.headline||'';

    s.body=(d.caption||'')
      .replace(d.headline||'','')
      .replace(/Источник:[\s\S]*/,'')
      .trim()
      .slice(0,600);

    s.date=designShortDate();

    designStore();
    renderDesign();
  };

  document.getElementById('designClear').onclick=()=>{
    s.image='';

    if(designVideo){
      designVideo.pause();
      URL.revokeObjectURL(designVideo.src);
      designVideo=null;
    }

    designImageLoad('');
    designStore();
  };

  document.getElementById('designResetAll').onclick=()=>{
    if(designRecording){
      document.getElementById('designNotice').textContent=
        'Сначала отмените экспорт видео.';
      return;
    }

    if(!confirm(
      'Сбросить все изменения шаблона? '+
      'Черновики новостей не затронутся.'
    ))return;

    if(designVideo){
      designVideo.pause();
      URL.revokeObjectURL(designVideo.src);
      designVideo.src='';
      designVideo=null;
    }

    if(designMusic){designMusic.pause();URL.revokeObjectURL(designMusic.src);designMusic=null;}
    designImg=null;
    designLogo=null;
    designDrag=null;

    try{
      localStorage.removeItem('daw_native_design');
    }catch(e){}

    designCfg={...DESIGN_DEFAULTS};
    renderDesign();

    document.getElementById('designNotice').textContent=
      'Шаблон сброшен. Черновики сохранены.';
  };

  document.getElementById('designReset').onclick=()=>{
    s.titleY=1130;
    s.bodyY=1302;
    s.size=40;
    s.bodySize=22;

    document.getElementById('designSize').value=s.size;
    document.getElementById('designBodySize').value=s.bodySize;

    designStore();
    designPaint();
  };

  const handleDesignImage=e=>{
    let file=e.target.files[0];

    if(!file||!file.type.startsWith('image/'))return;

    let reader=new FileReader();

    reader.onload=()=>{
      let im=new Image();

      im.onload=()=>{
        let c=document.createElement('canvas');

        let k=Math.min(
          1,
          1600/Math.max(im.width,im.height)
        );

        c.width=Math.round(im.width*k);
        c.height=Math.round(im.height*k);

        c.getContext('2d').drawImage(
          im,0,0,c.width,c.height
        );

        s.image=c.toDataURL('image/jpeg',.72);

        designImageLoad(s.image);
        designStore();
      };

      im.src=reader.result;
    };

    reader.readAsDataURL(file);
  };

  const handleDesignVideo=e=>{
    const file=e.target.files[0];
    if(!file)return;

    if(designVideo){
      designVideo.pause();
      URL.revokeObjectURL(designVideo.src);
    }

    const v=document.createElement('video');

    v.muted=true;
    v.loop=true;
    v.playsInline=true;
    v.preload='auto';
    v.src=URL.createObjectURL(file);

    designVideo=v;

    v.onloadeddata=()=>{
      v.play().catch(()=>{});
      designPaint();
    };

    v.onerror=()=>{
      document.getElementById('designNotice').textContent=
        'Не удалось прочитать видео';
    };
  };

  document.getElementById('designMediaFile').onchange=e=>{
    const file=e.target.files[0];if(!file)return;
    if(file.type.startsWith('video/')){handleDesignVideo(e);s.image='';designImg=null;designStore();}
    else if(file.type.startsWith('image/')){if(designVideo){designVideo.pause();URL.revokeObjectURL(designVideo.src);designVideo=null;}handleDesignImage(e);}
    else document.getElementById('designNotice').textContent='Выбери фото или видео';
  };
  document.getElementById('designExportVideo').onclick=async()=>{
    const notice=document.getElementById('designNotice');
    const btn=document.getElementById('designExportVideo');
    const cancelBtn=document.getElementById('designCancelVideo');


    if(designRecording)return;

    if(
      !HTMLCanvasElement.prototype.captureStream||
      !window.MediaRecorder
    ){
      notice.textContent=
        'Этот браузер не поддерживает экспорт видео.';
      return;
    }

    const duration=Math.min(
      60,
      Math.max(
        3,
        Number(document.getElementById('designDuration').value)||10
      )
    );

    const cv=document.getElementById('designCanvas');

    const mime=[
      'video/mp4;codecs="avc1.42E01E"',
      'video/mp4;codecs=avc1',
      'video/mp4'
    ].find(t=>MediaRecorder.isTypeSupported(t));

    if(!mime){
      notice.textContent=
        'Этот браузер не поддерживает прямой экспорт MP4.';
      return;
    }

    let recorder;
    let stream;
    let audioContext;
    let frames=[];
    let raf;
    let timer;
    let cancelled=false;
    let resolveWait;

    const finishWait=()=>{
      if(resolveWait){
        let r=resolveWait;
        resolveWait=null;
        r();
      }
    };

    try{
      designRecording=true;
      btn.disabled=true;
      cancelBtn.style.display='';
      cancelBtn.disabled=false;

      designCancelExport=()=>{
        cancelled=true;
        notice.textContent='Отменяем экспорт…';
        cancelBtn.disabled=true;
        finishWait();
      };

      cancelBtn.onclick=()=>{
        if(designCancelExport){
          designCancelExport();
        }
      };

      stream=cv.captureStream(30);
      // Mix the source video's audio and optional music into the recorded stream.
      const AC=window.AudioContext||window.webkitAudioContext;
      if((designVideo||designMusic)&&!AC)throw Error('Браузер не поддерживает обработку звука.');
      if(AC&&(designVideo||designMusic)){
        audioContext=new AC();
        const mix=audioContext.createMediaStreamDestination();
        const connectAudio=(element,volume)=>{
          const source=audioContext.createMediaElementSource(element);
          const gain=audioContext.createGain();
          gain.gain.value=volume;
          source.connect(gain);
          gain.connect(mix);
          element.muted=false;
          element.volume=1;
        };
        if(designVideo)connectAudio(designVideo,Number(document.getElementById('designOriginalVolume').value)/100);
        if(designMusic)connectAudio(designMusic,Number(document.getElementById('designMusicVolume').value)/100);
        mix.stream.getAudioTracks().forEach(track=>stream.addTrack(track));
        await audioContext.resume();
        if(designVideo){
          designVideo.currentTime=0;
          await designVideo.play();
        }
        if(designMusic){
          designMusic.currentTime=0;
          await designMusic.play();
        }
      }

      recorder=new MediaRecorder(
        stream,
        {
          mimeType:mime,
          videoBitsPerSecond:5000000
        }
      );

      recorder.ondataavailable=e=>{
        if(e.data.size&&!cancelled){
          frames.push(e.data);
        }
      };

      const completed=new Promise((resolve,reject)=>{
        recorder.onstop=resolve;
        recorder.onerror=()=>{
          reject(new Error('Ошибка записи'));
        };
      });

      recorder.start(500);

      const started=performance.now();

      function tick(){
        if(cancelled)return;

        designPaint();

        if(designRecording){
          raf=requestAnimationFrame(tick);
        }
      }

      tick();

      await new Promise(resolve=>{
        resolveWait=resolve;

        timer=setInterval(()=>{
          if(cancelled){
            finishWait();
            return;
          }

          let elapsed=(performance.now()-started)/1000;

          notice.textContent=
            'Создаём видео: '+
            Math.min(
              100,
              Math.round(elapsed/duration*100)
            )+'%';

          if(elapsed>=duration){
            finishWait();
          }
        },200);
      });

      clearInterval(timer);

      if(recorder.state!=='inactive'){
        recorder.stop();
      }

      await completed;

      if(cancelled){
        notice.textContent=
          'Экспорт отменён. Файл не сохранён.';
        return;
      }

      const blob=new Blob(
        frames,
        {type:mime}
      );

        const url=URL.createObjectURL(blob);
        const link=document.createElement('a');

        link.href=url;
        link.download='theDAW-reels-'+Date.now()+'.mp4';
        link.click();

        setTimeout(
          ()=>URL.revokeObjectURL(url),
          60000
        );

        notice.textContent=
          'Видео готово! MP4 сохранён со звуком, если он был добавлен.';
    }catch(err){
      notice.textContent=cancelled
        ?'Экспорт отменён.'
        :'Ошибка экспорта: '+err.message;

    }finally{
      clearInterval(timer);
      finishWait();

      designRecording=false;
      designCancelExport=null;

      btn.disabled=false;
      cancelBtn.style.display='none';
      cancelBtn.onclick=null;

      cancelAnimationFrame(raf);

      if(recorder&&recorder.state!=='inactive'){
        try{
          recorder.stop();
        }catch(e){}
      }

      if(designMusic)designMusic.pause();
      if(audioContext)await audioContext.close().catch(()=>{});
      if(stream){
        stream.getTracks().forEach(
          t=>t.stop()
        );
      }

      frames.length=0;
      designPaint();
    }
  };

  document.getElementById('designDownload').onclick=()=>{
    designPaint();

    let a=document.createElement('a');

    a.href=document.getElementById(
      'designCanvas'
    ).toDataURL('image/png');

    a.download='theDAW-'+Date.now()+'.png';
    a.click();
  };

  let cv=document.getElementById('designCanvas');

  cv.onpointerdown=e=>{
    let r=cv.getBoundingClientRect();

    let y=(e.clientY-r.top)/r.height*1920;

    designDrag=
      Math.abs(y-s.titleY)<Math.abs(y-s.bodyY)
        ?'titleY'
        :'bodyY';

    cv.setPointerCapture(e.pointerId);
  };

  cv.onpointermove=e=>{
    if(!designDrag)return;

    let r=cv.getBoundingClientRect();

    s[designDrag]=Math.round(
      Math.max(
        220,
        Math.min(
          1750,
          (e.clientY-r.top)/r.height*1920
        )
      )
    );

    designPaint();
  };

  cv.onpointerup=()=>{
    designDrag=null;
    designStore();
  };

  cv.onpointercancel=()=>{
    designDrag=null;
    designStore();
  };

  if(s.image){
    designImageLoad(s.image);
  }else{
    designImg=null;
    designPaint();
  }
}
</script>
