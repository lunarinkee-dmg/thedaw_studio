
<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#e8e8e8">
<title>theDĀW Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,900;1,400&display=swap" rel="stylesheet">
<style>
:root {
  font-family: Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif;
  color:#333333;
  background:#e8e8e8;
  font-size:15px;
}
*{box-sizing:border-box}
body{margin:0}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
a{color:#e8e8e8}
header{
  height:74px;
  padding:0 4%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid #575757;
  background:#333333;
}
.logo{font-size:23px;font-weight:900;letter-spacing:-1.5px}
.logo span{
  font-size:11px;
  letter-spacing:2px;
  color:#c5c5c5;
  margin-left:14px;
}
.pill{
  background:#404040;
  border:1px solid #626262;
  padding:7px 12px;
  border-radius:99px;
  font-size:11px;
  color:#e8e8e8;
  font-weight:800;
}
.app{
  display:grid;
  grid-template-columns:220px minmax(0,1fr);
  min-height:calc(100vh - 74px);
}
nav{
  border-right:1px solid #575757;
  padding:27px 14px;
  background:#333333;
}
nav button{
  display:flex;
  gap:13px;
  align-items:center;
  border:0;
  background:transparent;
  color:#d0d0d0;
  padding:13px 15px;
  border-radius:11px;
  width:100%;
  text-align:left;
  margin:4px 0;
}
nav button.active,nav button:hover{
  background:#494949;
  color:#ffffff;
}
nav .small{
  font-size:10px;
  letter-spacing:2px;
  color:#aaaaaa;
  margin:21px 14px 9px;
}
main{
  padding:38px 5%;
  max-width:1400px;
  width:100%;
  margin:auto;
}
h1{
  font-size:clamp(28px,4vw,47px);
  margin:0 0 9px;
  letter-spacing:-2px;
}
h2{font-size:22px;margin:0 0 15px}
p{line-height:1.65}
.muted{color:#bcbcbc}
.topline{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  flex-wrap:wrap;
  margin-bottom:27px;
}
.btn{
  border:1px solid #707070;
  background:#424242;
  color:#e8e8e8;
  border-radius:9px;
  padding:11px 16px;
  font-weight:700;
}
.btn.primary{
  background:#e8e8e8;
  color:#333333;
  border-color:#e8e8e8;
}
.btn:hover{filter:brightness(1.11)}
.grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:14px;
}
.card{
  border:1px solid #606060;
  background:#3c3c3c;
  border-radius:16px;
  padding:20px;
}
.card h3{
  line-height:1.35;
  font-size:20px;
  margin:14px 0;
}
.card .actions{
  display:flex;
  gap:7px;
  margin-top:20px;
  flex-wrap:wrap;
}
input,textarea,select{
  background:#383838;
  color:#e8e8e8;
  border:1px solid #727272;
  border-radius:9px;
  padding:12px;
  width:100%;
}
textarea{min-height:125px;resize:vertical}
label{
  display:block;
  font-size:12px;
  font-weight:800;
  color:#d0d0d0;
  margin:17px 0 8px;
}
.tag{
  color:#e8e8e8;
  text-transform:uppercase;
  letter-spacing:1.3px;
  font-size:10px;
  font-weight:800;
}
.meta{font-size:12px;color:#bcbcbc}
.mini{font-size:12px}
.banner{
  padding:16px 20px;
  border:1px solid #858585;
  background:#484848;
  border-radius:12px;
  margin:17px 0;
  color:#e8e8e8;
}
.danger{
  background:#543b3b;
  border-color:#9c7373;
  color:#f0c7bb;
}

/* Monochrome editorial system */
:root{color-scheme:dark}
::selection{background:#e8e8e8;color:#333333}
:focus-visible{outline:2px solid #e8e8e8;outline-offset:3px}
.btn,.card,nav button,.news-edge-arrow{transition:background-color .18s ease,border-color .18s ease,transform .18s ease}
.btn:hover:not(:disabled){background:#555555;filter:none}
.btn.primary:hover:not(:disabled){background:#ffffff;color:#333333}
.card:hover{border-color:#898989}
nav button.active{font-weight:800;border-left:2px solid #e8e8e8}
input:focus,textarea:focus,select:focus{border-color:#e8e8e8;outline:none}

/* theDĀW signature red: intentional, restrained accents */
:root{--daw-base:#333333;--daw-light:#e8e8e8;--daw-red:#B30012}
.logo::first-letter{color:var(--daw-red)}
.pill{border-color:var(--daw-red)}
.pill::first-letter{color:var(--daw-red)}
nav button.active{border-left-color:var(--daw-red);background:#484042}
nav button.active:hover{background:#554346}
.btn.primary{background:var(--daw-red);border-color:var(--daw-red);color:#ffffff}
.btn.primary:hover:not(:disabled){background:#cf1024;color:#ffffff;border-color:#cf1024}
.tag{color:#ff6876}
.news-page-numbers .selected{color:#ff6876}
.news-edge-arrow:hover:not(:disabled){border-color:var(--daw-red);color:#ffffff}
:focus-visible{outline-color:#ff6876}
input:focus,textarea:focus,select:focus{border-color:#c84a58}
.design-toggle-row input{accent-color:var(--daw-red)}

/* НОВОСТИ */
.news-heading{margin-bottom:18px}
.news-heading h1{font-size:clamp(28px,3vw,42px)}
.news-heading p{margin:5px 0 0;font-size:13px}
.news-grid{
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:12px;
}
.news-card{
  padding:15px 17px;
  border-radius:13px;
  display:flex;
  flex-direction:column;
  min-width:0;
}
.news-card h3{
  font-size:clamp(15px,1.08vw,18px);
  line-height:1.27;
  margin:9px 0 7px;
  display:-webkit-box;
  -webkit-box-orient:vertical;
  -webkit-line-clamp:3;
  line-clamp:3;
  overflow:hidden;
}
.news-summary{
  display:-webkit-box;
  -webkit-box-orient:vertical;
  -webkit-line-clamp:3;
  line-clamp:3;
  overflow:hidden;
  font-size:12.5px;
  line-height:1.4;
  max-height:4.2em;
  margin:0 0 10px;
}
.news-meta{font-size:11px;margin-top:auto}
.news-card .actions{margin-top:10px;gap:6px}
.news-card .actions .btn{
  font-size:11.5px;
  padding:8px 10px;
  white-space:nowrap;
}
.news-carousel{
  display:grid;
  grid-template-columns:36px minmax(0,1fr) 36px;
  gap:12px;
  align-items:center;
}
.news-carousel>.news-grid{
  grid-column:2;
  grid-row:1;
}
.news-edge-arrow{
  width:36px;
  height:60px;
  border:1px solid #626262;
  border-radius:9px;
  background:#404040;
  color:#e8e8e8;
  font-size:39px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.news-edge-arrow:disabled{opacity:.24}
.news-edge-left{grid-column:1;grid-row:1}
.news-edge-right{grid-column:3;grid-row:1}
.news-pagination{
  display:flex;
  justify-content:center;
  align-items:center;
  margin:14px 0;
}
.news-page-numbers{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
}
.news-page-numbers .btn{
  border:0;
  background:transparent;
  padding:4px 6px;
  color:#c3c3c3;
}
.news-page-numbers .selected{
  color:#e8e8e8;
  text-decoration:underline;
  text-underline-offset:5px;
}
.news-page-ellipsis{color:#bcbcbc}

/* ДИЗАЙН */
.design-layout{
  display:grid;
  grid-template-columns:minmax(270px,400px) minmax(270px,1fr);
  gap:22px;
  align-items:start;
}
.design-form{display:grid;gap:12px}
.design-form label{margin:0}
.design-stage{
  display:flex;
  justify-content:center;
  background:#424242;
  padding:16px;
  border-radius:15px;
}
#designCanvas{
  width:100%;
  max-width:410px;
  aspect-ratio:9/16;
  touch-action:none;
  cursor:grab;
}
@media(max-width:1000px){
  .news-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:800px){
  .design-layout{grid-template-columns:1fr}
  .design-stage{order:-1}
  #designCanvas{max-width:330px}
}
@media(max-width:670px){
  .app{display:block}
  nav{
    display:flex;
    overflow-x:auto;
    border-right:none;
    border-bottom:1px solid #575757;
    padding:7px;
  }
  nav button{white-space:nowrap;font-size:12px}
  nav .small{display:none}
  main{padding:25px 17px}
  .grid,.news-grid{grid-template-columns:1fr}
  .logo span{display:none}
  .card{padding:15px}
  .news-carousel{
    grid-template-columns:28px minmax(0,1fr) 28px;

  }
  .news-edge-arrow{width:28px;height:48px;font-size:30px}
  .news-page-numbers{gap:5px}
}

  --glass-fill:rgba(255,255,255,.44);
  --glass-stroke:rgba(255,255,255,.78);
  --glass-shadow:0 12px 34px rgba(45,45,45,.085),inset 0 1px 0 rgba(255,255,255,.86);
}
body{
  min-height:100vh;
  background:
    radial-gradient(ellipse 55% 42% at 85% 9%,rgba(179,0,18,.105),transparent 75%),
    radial-gradient(ellipse 46% 38% at 7% 72%,rgba(255,255,255,.92),transparent 76%),

 position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);

 border:1px solid rgba(255,255,255,.94);

:root{color-scheme:light;--daw-base:#e8e8e8;--daw-light:#333333;--daw-red:#B30012}

<body>

<header>
  <div class="logo">theDĀW<span>STUDIO / WORKSPACE</span></div>
  <div class="section-switch" role="group" aria-label="Переключение разделов">
    <button class="section-switch-main" id="sectionSwitchMain" type="button" aria-label="Переключить раздел">Новости</button>
    <button class="section-switch-icon" id="sectionSwitchIcon" type="button" aria-label="Переключить раздел" title="Перейти в конструктор">◈</button>
  </div>
  <div class="pill">● LOCAL DEMO</div>
</header>

<div class="app">
<main id="main"></main>
</div>

<script>
const K='thedaw_studio_v02';
let saved={};
try {
  saved=JSON.parse(localStorage.getItem(K))||{};
} catch(e){}

let data={
  news:[],
  drafts:saved.drafts||[],
  media:saved.media||[]
};

let view='inbox';
let constructorTab='drafts';
let current=null;
let newsPage=1;
let newsLoading=false;
let newsError='';

const esc=x=>String(x??'').replace(
  /[&<>"']/g,
  c=>({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[c])
);

function tiktokSearchUrl(title){
  const query=String(title||'').replace(/\s+/g,' ').trim().slice(0,130);
  return 'https://www.tiktok.com/search/video?q='+encodeURIComponent(query);
}

const save=()=>localStorage.setItem(
  K,
  JSON.stringify({
    drafts:data.drafts,
    media:data.media
  })
);

function updateSectionSwitch(){
  const main=document.getElementById('sectionSwitchMain');
  const icon=document.getElementById('sectionSwitchIcon');
  if(!main||!icon)return;
  const news=view==='inbox';
  main.textContent=news?'Новости':'Конструктор';
  icon.textContent=news?'▦':'◈';
  const next=news?'конструктор':'новости';
  main.title='Перейти в '+next;
  icon.title='Перейти в '+next;
  main.setAttribute('aria-label','Сейчас '+(news?'Новости':'Конструктор')+'. Перейти в '+next);
  icon.setAttribute('aria-label','Перейти в '+next);
}
function go(v){
  view=v;
  updateSectionSwitch();
  render();
}
function toggleSection(){go(view==='inbox'?'constructor':'inbox')}
document.getElementById('sectionSwitchMain').onclick=toggleSection;
document.getElementById('sectionSwitchIcon').onclick=toggleSection;
updateSectionSwitch();

function create(id){
  let n=data.news.find(x=>x.id===id);
  if(!n)return;

  let d={
    id:'d'+Date.now(),
    sourceUrl:n.url,
    sourceTitle:n.title,
    sourceSummary:n.summary,
    originalTitle:n.title,
    originalSummary:n.summary,
    sourceName:n.source,
    headline:n.title,
    caption:(n.title)+'\n\n'+(n.summary)+
      '\n\nИсточник: '+n.source+' — '+n.url,
    tiktok:n.title,
    category:n.category
  };

  data.drafts.unshift(d);
  current=d.id;
  constructorTab='drafts';
  save();
  go('constructor');
}

function update(k,v){
  let d=data.drafts.find(x=>x.id===current);

function newsTimestamp(n){
  const raw=String(
    n.published_at||n.date||n.published||n.pubDate||''
  ).trim();

  const ru=raw.match(
    /^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})(?:\s+(\d{1,2}):(\d{2}))?/
  );

  if(ru){
    const d=new Date(
      Number(ru[3]),
      Number(ru[2])-1,
      Number(ru[1]),
      Number(ru[4]||0),
      Number(ru[5]||0)
    );

    return d.getFullYear()===Number(ru[3]) &&
      d.getMonth()===Number(ru[2])-1 &&
      d.getDate()===Number(ru[1])
      ?d.getTime():NaN;
  }

  return Date.parse(raw);
}

function recentNews(items){
  const now=Date.now();
  const cutoff=now-90*24*60*60*1000;

  return items.filter(n=>{
    const t=newsTimestamp(n);
    return Number.isFinite(t) &&
      t>=cutoff &&
      t<=now+5*60*1000;
  }).sort((a,b)=>newsTimestamp(b)-newsTimestamp(a)).slice(0,10);
}

async function saveSources(){
 const status=document.getElementById('sourceStatus');
 if(!sourceToken){status.textContent='Для сохранения подключите GitHub.';return false;}
 status.textContent='Сохраняем источники в GitHub…';
 try{
  const endpoint='https://api.github.com/repos/lunarinkee-dmg/thedaw_studio/contents/sources.json';
  const headers={'Authorization':'Bearer '+sourceToken,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
  const current=await fetch(endpoint,{headers,cache:'no-store'});
  if(!current.ok)throw Error('Не удалось прочитать файл: HTTP '+current.status);
  const info=await current.json();
  const raw=unescape(encodeURIComponent(JSON.stringify(sourceEditor,null,2)+'\n'));
  const encoded=btoa(raw);
  const response=await fetch(endpoint,{method:'PUT',headers:{...headers,'Content-Type':'application/json'},body:JSON.stringify({message:'Update news sources from theDAW Studio',content:encoded,sha:info.sha})});
  if(!response.ok)throw Error('GitHub HTTP '+response.status+': '+(await response.text()).slice(0,160));
  status.textContent='Сохранено в GitHub. Агрегатор применит изменения при следующем запуске.';
  return true;
 }catch(e){status.textContent='Ошибка сохранения: '+e.message;return false;}
}

function renderConstructorTabs(){

  const bar=document.createElement('div');
  bar.className='constructor-tabs';
  bar.setAttribute('role','tablist');
  bar.setAttribute('aria-label','Разделы конструктора');
  tabs.forEach(([id,label])=>{
    const btn=document.createElement('button');
    btn.type='button';
    btn.className='constructor-tab'+(constructorTab===id?' active':'');

  });

  title.innerHTML='<h1>Конструктор</h1><p class="muted">От идеи до готовой публикации — всё в одном месте.</p>';
  m.prepend(bar);
  m.prepend(title);
}

async function load(manual=false){
  if(newsLoading)return;

  newsLoading=true;
  newsError='';

  if(view==='inbox')render();

  try{
    const r=await fetch(
      './news.json?v='+Date.now(),
      {cache:'no-store'}
    );

    if(!r.ok)throw Error('HTTP '+r.status);

    const n=await r.json();

    if(!Array.isArray(n)){
      throw Error('Неверный формат');
    }

    data.news=recentNews(n);

    if(manual)newsPage=1;

  }catch(e){
    newsError='Не удалось обновить новости: '+e.message;
  }finally{
    newsLoading=false;
    if(view==='inbox')render();
  }
}

function generateAI(id){
  const d=data.drafts.find(x=>x.id===id);
  if(!d)return;
  const title=d.headline||d.sourceTitle||'';
  d.caption=title+'\\n\\n'+(d.sourceSummary||'')+'\\n\\nИсточник: '+(d.sourceName||'')+' — '+(d.sourceUrl||'');
  d.tiktok=title;
  save();render();
}

render();

function designWrap(ctx,txt,x,y,width,size,lines,style='title'){
  const title=style==='title';
  const tracking=title?-.022*size:-.011*size;
  const leading=title?1.12:1.22;

  ctx.font=title
    ?'900 '+size+'px Montserrat,Arial,sans-serif'
    :'italic 400 '+size+'px Montserrat,Arial,sans-serif';

  const measure=t=>{
    let w=0;
    for(const ch of t){
      w+=ctx.measureText(ch).width+tracking;
    }
    return w;
  };

  let words=String(txt||'').split(/\s+/);
  let rows=[];
  let line='';

  for(const word of words){
    let next=line?line+' '+word:word;
    if(measure(next)>width&&line){
      rows.push(line);
      line=word;
    }else{
      line=next;
    }
  }

  rows.push(line);

  rows.slice(0,lines).forEach((t,i)=>{
    let xx=x;
    for(const ch of t){
      ctx.fillText(ch,xx,y+i*size*leading);
      xx+=ctx.measureText(ch).width+tracking;
    }
  });
}

function designPaint(){
  const cv=document.getElementById('designCanvas');
  if(!cv)return;

  const ctx=cv.getContext('2d');
  const s=designCfg;

  ctx.fillStyle=s.bg;
  ctx.fillRect(0,0,1080,1920);

  const media=
    designVideo&&designVideo.readyState>=2
      ?designVideo
      :designImg;

  if(media){
    const mw=media.videoWidth||media.width;
    const mh=media.videoHeight||media.height;

    if(mw>0&&mh>0){
      const k=Math.max(1080/mw,1920/mh)*
        Math.max(1,Number(s.cropZoom)||1);

      const w=mw*k;
      const h=mh*k;

      const dx=(1080-w)/2+(Number(s.cropX)||0);
      const dy=(1920-h)/2+(Number(s.cropY)||0);

      ctx.save();
      ctx.beginPath();
      ctx.rect(0,0,1080,1920);
      ctx.clip();
      ctx.drawImage(media,dx,dy,w,h);
      ctx.restore();
    }
  }

  if(s.gradient!==false){
  let top=ctx.createLinearGradient(0,0,0,520);
  top.addColorStop(0,'rgba(0,0,0,.55)');
  top.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=top;ctx.fillRect(0,0,1080,520);
  let bottom=ctx.createLinearGradient(0,670,0,1920);
  bottom.addColorStop(0,'rgba(0,0,0,0)');
  bottom.addColorStop(.5,'rgba(0,0,0,.42)');
  bottom.addColorStop(1,'rgba(0,0,0,.84)');
  ctx.fillStyle=bottom;ctx.fillRect(0,670,1080,1250);
  }

  ctx.textBaseline='top';
  ctx.fillStyle='#fff';

  if(
    designLogo&&
    designLogo.complete&&
    designLogo.naturalWidth
  ){
    ctx.drawImage(designLogo,108,106,84,129);
  }

  ctx.font='400 28.5px Arial,sans-serif';
  ctx.textAlign='right';
  ctx.fillText(s.date||designShortDate(),970,155);
  ctx.textAlign='left';

  ctx.fillStyle='#fff';

  designWrap(
    ctx,
    s.title||'ЗАГОЛОВОК НОВОСТИ',
    108,
    s.titleY,
    862,
    +s.size,
    5
  );

  ctx.fillStyle='#f3f3f3';

  designWrap(
    ctx,
    s.body||'Описание новости',
    108,
    s.bodyY,
    800,
    +s.bodySize,
    9,
    'body'
  );
}

        <label>Громкость музыки</label>
        <input type="range" id="designMusicVolume" min="0" max="100" value="70">
        <label>Кадрирование фона — масштаб</label>
        <input type="range"
          id="designCropZoom" min="1" max="3" step="0.01">

        <label>Сдвиг фона по горизонтали</label>
        <input type="range"
          id="designCropX" min="-1500" max="1500" step="5">

        <label>Сдвиг фона по вертикали</label>
        <input type="range"
          id="designCropY" min="-2200" max="2200" step="5">

        <button class="btn" id="designCropReset">
          Сбросить кадрирование
        </button>

        <label for="designDuration">Длительность Reels: <strong id="designDurationValue">10 сек.</strong></label>
        <input type="range" min="3" max="60" step="1" value="10" id="designDuration">
        <div class="muted mini">От 3 до 60 секунд. Применяется при экспорте MP4.</div>

        <button class="btn" id="designClear">
          Убрать фото
        </button>

        <label>Размер заголовка</label>
        <input type="number"
          min="20" max="130" step="0.5" id="designSize">

        <label>Логотип (PNG с прозрачностью)</label>
        <input type="file"
          id="designLogoFile" accept="image/png,image/webp">

        <label>Размер описания</label>
        <input type="number"
          min="15" max="70" step="0.25" id="designBodySize">

        <button class="btn" id="designReset">
          Сбросить положение текста
        </button>

        <button class="btn" id="designResetAll"
          style="border-color:#b66;color:#ffb5b5">
          ↺ Сбросить весь шаблон
        </button>

        <button class="btn primary" id="designExportVideo">
          🎬 Скачать MP4
        </button>

        <button class="btn primary" id="designInstagramPublish" type="button">
          ↗ Залить в Instagram
        </button>

        <button class="btn primary" id="designTikTokPublish" type="button">
          ↗ Залить в TikTok
        </button>

        <label>Подпись для Instagram Reels</label>
        <textarea id="designInstagramCaption"
          rows="4"
          placeholder="Текст публикации"></textarea>

        <button class="btn" id="designCancelVideo"
          style="display:none">
          ✕ Отменить экспорт
        </button>

        <p class="muted mini" id="designNotice">
          Настройки сохраняются в этом браузере.
        </p>

      </div>

      <div class="design-stage" style="position:relative">
        <button class="btn primary" id="designInstagramOpen" type="button" title="Открыть Instagram" style="position:absolute;left:12px;top:16px;z-index:2;padding:10px 12px;font-size:12px">↗ Instagram</button>
        <canvas id="designCanvas"
          width="1080" height="1920"></canvas>
      </div>
    </div>
  `;

  document.getElementById('designInstagramOpen').onclick=()=>window.open('https://www.instagram.com/','_blank','noopener,noreferrer');
  document.getElementById('designInstagramPublish').onclick=async()=>{
    const caption=document.getElementById('designInstagramCaption').value.trim();
    if(caption&&navigator.clipboard&&window.isSecureContext){
      try{await navigator.clipboard.writeText(caption);}catch(e){}
    }
    document.getElementById('designNotice').textContent=
      'Instagram открыт. Прямая публикация пока не подключена: скачай PNG или MP4 и загрузи файл вручную.'+
      (caption?' Подпись скопирована, если браузер разрешил доступ к буферу обмена.':'');
    window.open('https://www.instagram.com/','_blank','noopener,noreferrer');
  };
  document.getElementById('designTikTokPublish').onclick=()=>{
    const notice=document.getElementById('designNotice');
    notice.textContent='Публикация в TikTok пока не подключена. Для прямой загрузки требуется TikTok Content Posting API и авторизация аккаунта. MP4 можно скачать кнопкой выше.';
    window.open('https://developers.tiktok.com/','_blank','noopener,noreferrer');
  };

  const durationSlider=document.getElementById('designDuration');
  const durationValue=document.getElementById('designDurationValue');
  durationSlider.value=String(Math.min(60,Math.max(3,Number(s.duration)||10)));
  durationValue.textContent=durationSlider.value+' сек.';
  durationSlider.oninput=()=>{
    s.duration=Number(durationSlider.value);
    durationValue.textContent=durationSlider.value+' сек.';
    designStore();
  };

  const logoInput=document.getElementById('designLogoFile');

  if(logoInput){
    logoInput.onchange=e=>{
      let file=e.target.files[0];
      if(!file)return;

      let reader=new FileReader();

      reader.onload=()=>{
        designCfg.logo=reader.result;
        designLogoLoad(reader.result);
        designStore();
      };

      reader.readAsDataURL(file);
    };
  }

  designLogoLoad(designCfg.logo);
  const gradientToggle=document.getElementById('designGradient');
  gradientToggle.checked=s.gradient!==false;
  gradientToggle.onchange=()=>{s.gradient=gradientToggle.checked;designStore();designPaint()};
  document.getElementById('designMusicFile').onchange=e=>{
    const f=e.target.files[0]; if(!f)return;
    if(designMusic){designMusic.pause();URL.revokeObjectURL(designMusic.src);}
    designMusic=new Audio(URL.createObjectURL(f));
    designMusic.loop=true;
    designMusic.preload='auto';
    document.getElementById('designNotice').textContent='Музыка загружена: '+f.name;
  };
  document.getElementById('designRemoveMusic').onclick=()=>{
    if(designMusic){designMusic.pause();URL.revokeObjectURL(designMusic.src);designMusic=null;}
    document.getElementById('designMusicFile').value='';
    document.getElementById('designNotice').textContent='Музыка удалена';
  };

  for(const [id,key] of [
    ['designCropZoom','cropZoom'],
    ['designCropX','cropX'],
    ['designCropY','cropY']
  ]){
    let el=document.getElementById(id);

    el.value=s[key]??(key==='cropZoom'?1:0);

    el.oninput=()=>{
      s[key]=Number(el.value);
      designStore();
      designPaint();
    };
  }

  document.getElementById('designCropReset').onclick=()=>{
    s.cropZoom=1;
    s.cropX=0;
    s.cropY=0;

    for(const [id,key] of [
      ['designCropZoom','cropZoom'],
      ['designCropX','cropX'],
      ['designCropY','cropY']
    ]){
      document.getElementById(id).value=s[key];
    }

    designStore();
    designPaint();
  };

  let fields={
    designTitle:'title',
    designBody:'body',
    designDate:'date',
    designSize:'size',
    designBodySize:'bodySize'
  };

  Object.keys(fields).forEach(id=>{
    let el=document.getElementById(id);
    let key=fields[id];

    el.value=s[key];

    el.oninput=()=>{
      s[key]=el.type==='number'
        ?Number(el.value)
        :el.value;

      designStore();
      designPaint();
    };
  });

  document.getElementById('designFill').onclick=()=>{
    let d=data.drafts.find(
      x=>x.id===document.getElementById('designDraft').value
    );

    if(!d)return;

    s.title=d.headline||'';

    s.body=(d.caption||'')
      .replace(d.headline||'','')
      .replace(/Источник:[\s\S]*/,'')
      .trim()
      .slice(0,600);

    s.date=designShortDate();

    designStore();
    renderDesign();
  };

  document.getElementById('designClear').onclick=()=>{
    s.image='';

    if(designVideo){
      designVideo.pause();
      URL.revokeObjectURL(designVideo.src);
      designVideo=null;
    }

    designImageLoad('');
    designStore();
  };

  document.getElementById('designResetAll').onclick=()=>{
    if(designRecording){
      document.getElementById('designNotice').textContent=
        'Сначала отмените экспорт видео.';
      return;
    }

    if(!confirm(
      'Сбросить все изменения шаблона? '+
      'Черновики новостей не затронутся.'
    ))return;

    if(designVideo){
      designVideo.pause();
      URL.revokeObjectURL(designVideo.src);
      designVideo.src='';
      designVideo=null;
    }

    if(designMusic){designMusic.pause();URL.revokeObjectURL(designMusic.src);designMusic=null;}
    designImg=null;
    designLogo=null;
    designDrag=null;

    try{
      localStorage.removeItem('daw_native_design');
    }catch(e){}

    designCfg={...DESIGN_DEFAULTS};
    renderDesign();

    document.getElementById('designNotice').textContent=
      'Шаблон сброшен. Черновики сохранены.';
  };

  document.getElementById('designReset').onclick=()=>{
    s.titleY=1130;
    s.bodyY=1302;
    s.size=40;
    s.bodySize=22;

    document.getElementById('designSize').value=s.size;
    document.getElementById('designBodySize').value=s.bodySize;

    designStore();
    designPaint();
  };

  const handleDesignImage=e=>{
    let file=e.target.files[0];

    if(!file||!file.type.startsWith('image/'))return;

    let reader=new FileReader();

    reader.onload=()=>{
      let im=new Image();

      im.onload=()=>{
        let c=document.createElement('canvas');

        let k=Math.min(
          1,
          1600/Math.max(im.width,im.height)
        );

        c.width=Math.round(im.width*k);
        c.height=Math.round(im.height*k);

        c.getContext('2d').drawImage(
          im,0,0,c.width,c.height
        );

        s.image=c.toDataURL('image/jpeg',.72);

        designImageLoad(s.image);
        designStore();
      };

      im.src=reader.result;
    };

    reader.readAsDataURL(file);
  };

  const handleDesignVideo=e=>{
    const file=e.target.files[0];
    if(!file)return;

    if(designVideo){
      designVideo.pause();
      URL.revokeObjectURL(designVideo.src);
    }

    const v=document.createElement('video');

    v.muted=true;
    v.loop=true;
    v.playsInline=true;
    v.preload='auto';
    v.src=URL.createObjectURL(file);

    designVideo=v;

    v.onloadeddata=()=>{
      v.play().catch(()=>{});
      designPaint();
    };

    v.onerror=()=>{
      document.getElementById('designNotice').textContent=
        'Не удалось прочитать видео';
    };
  };

  document.getElementById('designMediaFile').onchange=e=>{
    const file=e.target.files[0];if(!file)return;
    if(file.type.startsWith('video/')){handleDesignVideo(e);s.image='';designImg=null;designStore();}
    else if(file.type.startsWith('image/')){if(designVideo){designVideo.pause();URL.revokeObjectURL(designVideo.src);designVideo=null;}handleDesignImage(e);}
    else document.getElementById('designNotice').textContent='Выбери фото или видео';
  };
  document.getElementById('designExportVideo').onclick=async()=>{
    const notice=document.getElementById('designNotice');
    const btn=document.getElementById('designExportVideo');
    const cancelBtn=document.getElementById('designCancelVideo');


    if(designRecording)return;

    if(
      !HTMLCanvasElement.prototype.captureStream||
      !window.MediaRecorder
    ){
      notice.textContent=
        'Этот браузер не поддерживает экспорт видео.';
      return;
    }

    const duration=Math.min(
      60,
      Math.max(
        3,
        Number(document.getElementById('designDuration').value)||10
      )
    );

    const cv=document.getElementById('designCanvas');

    const mime=[
      'video/mp4;codecs="avc1.42E01E"',
      'video/mp4;codecs=avc1',
      'video/mp4'
    ].find(t=>MediaRecorder.isTypeSupported(t));

    if(!mime){
      notice.textContent=
        'Этот браузер не поддерживает прямой экспорт MP4.';
      return;
    }

    let recorder;
    let stream;
    let audioContext;
    let frames=[];
    let raf;
    let timer;
    let cancelled=false;
    let resolveWait;

    const finishWait=()=>{
      if(resolveWait){
        let r=resolveWait;
        resolveWait=null;
        r();
      }
    };

    try{
      designRecording=true;
      btn.disabled=true;
      cancelBtn.style.display='';
      cancelBtn.disabled=false;

      designCancelExport=()=>{
        cancelled=true;
        notice.textContent='Отменяем экспорт…';
        cancelBtn.disabled=true;
        finishWait();
      };

      cancelBtn.onclick=()=>{
        if(designCancelExport){
          designCancelExport();
        }
      };

      stream=cv.captureStream(30);
      // Mix the source video's audio and optional music into the recorded stream.
      const AC=window.AudioContext||window.webkitAudioContext;
      if((designVideo||designMusic)&&!AC)throw Error('Браузер не поддерживает обработку звука.');
      if(AC&&(designVideo||designMusic)){
        audioContext=new AC();
        const mix=audioContext.createMediaStreamDestination();
        const connectAudio=(element,volume)=>{
          const source=audioContext.createMediaElementSource(element);
          const gain=audioContext.createGain();
          gain.gain.value=volume;
          source.connect(gain);
          gain.connect(mix);
          element.muted=false;
          element.volume=1;
        };
        if(designVideo)connectAudio(designVideo,Number(document.getElementById('designOriginalVolume').value)/100);
        if(designMusic)connectAudio(designMusic,Number(document.getElementById('designMusicVolume').value)/100);
        mix.stream.getAudioTracks().forEach(track=>stream.addTrack(track));
        await audioContext.resume();
        if(designVideo){
          designVideo.currentTime=0;
          await designVideo.play();
        }
        if(designMusic){
          designMusic.currentTime=0;
          await designMusic.play();
        }
      }

      recorder=new MediaRecorder(
        stream,
        {
          mimeType:mime,
          videoBitsPerSecond:5000000
        }
      );

      recorder.ondataavailable=e=>{
        if(e.data.size&&!cancelled){
          frames.push(e.data);
        }
      };

      const completed=new Promise((resolve,reject)=>{
        recorder.onstop=resolve;
        recorder.onerror=()=>{
          reject(new Error('Ошибка записи'));
        };
      });

      recorder.start(500);

      const started=performance.now();

      function tick(){
        if(cancelled)return;

        designPaint();

        if(designRecording){
          raf=requestAnimationFrame(tick);
        }
      }

      tick();

      await new Promise(resolve=>{
        resolveWait=resolve;

        timer=setInterval(()=>{
          if(cancelled){
            finishWait();
            return;
          }

          let elapsed=(performance.now()-started)/1000;

          notice.textContent=
            'Создаём видео: '+
            Math.min(
              100,
              Math.round(elapsed/duration*100)
            )+'%';

          if(elapsed>=duration){
            finishWait();
          }
        },200);
      });

      clearInterval(timer);

      if(recorder.state!=='inactive'){
        recorder.stop();
      }

      await completed;

      if(cancelled){
        notice.textContent=
          'Экспорт отменён. Файл не сохранён.';
        return;
      }

      const blob=new Blob(
        frames,
        {type:mime}
      );

        const url=URL.createObjectURL(blob);
        const link=document.createElement('a');

        link.href=url;
        link.download='theDAW-reels-'+Date.now()+'.mp4';
        link.click();

        setTimeout(
          ()=>URL.revokeObjectURL(url),
          60000
        );

        notice.textContent=
          'Видео готово! MP4 сохранён со звуком, если он был добавлен.';
    }catch(err){
      notice.textContent=cancelled
        ?'Экспорт отменён.'
        :'Ошибка экспорта: '+err.message;

    }finally{
      clearInterval(timer);
      finishWait();

      designRecording=false;
      designCancelExport=null;

      btn.disabled=false;
      cancelBtn.style.display='none';
      cancelBtn.onclick=null;

      cancelAnimationFrame(raf);

      if(recorder&&recorder.state!=='inactive'){
        try{
          recorder.stop();
        }catch(e){}
      }

      if(designMusic)designMusic.pause();
      if(audioContext)await audioContext.close().catch(()=>{});
      if(stream){
        stream.getTracks().forEach(
          t=>t.stop()
        );
      }

      frames.length=0;
      designPaint();
    }
  };



  let cv=document.getElementById('designCanvas');

  cv.onpointerdown=e=>{
    let r=cv.getBoundingClientRect();

    let y=(e.clientY-r.top)/r.height*1920;

    designDrag=
      Math.abs(y-s.titleY)<Math.abs(y-s.bodyY)
        ?'titleY'
        :'bodyY';

    cv.setPointerCapture(e.pointerId);
  };

  cv.onpointermove=e=>{
    if(!designDrag)return;

    let r=cv.getBoundingClientRect();

    s[designDrag]=Math.round(
      Math.max(
        220,
        Math.min(
          1750,
          (e.clientY-r.top)/r.height*1920
        )
      )
    );

    designPaint();
  };

  cv.onpointerup=()=>{
    designDrag=null;
    designStore();
  };

  cv.onpointercancel=()=>{
    designDrag=null;
    designStore();
  };

  if(s.image){
    designImageLoad(s.image);
  }else{
    designImg=null;
    designPaint();
  }
}
</script>

</body>
</html>
