
<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#e8e8e8">
<title>theDĀW Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,900;1,400&display=swap" rel="stylesheet">
<style>
:root {
  font-family: Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif;
  color:#333333;
  background:#e8e8e8;
  font-size:15px;
}
*{box-sizing:border-box}
body{margin:0}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
a{color:#e8e8e8}
header{
  height:74px;
  padding:0 4%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid #575757;
  background:#333333;
}
.logo{font-size:23px;font-weight:900;letter-spacing:-1.5px}
.logo span{
  font-size:11px;
  letter-spacing:2px;
  color:#c5c5c5;
  margin-left:14px;
}
.pill{
  background:#404040;
  border:1px solid #626262;
  padding:7px 12px;
  border-radius:99px;
  font-size:11px;
  color:#e8e8e8;
  font-weight:800;
}
.app{
  display:grid;
  grid-template-columns:220px minmax(0,1fr);
  min-height:calc(100vh - 74px);
}
nav{
  border-right:1px solid #575757;
  padding:27px 14px;
  background:#333333;
}
nav button{
  display:flex;
  gap:13px;
  align-items:center;
  border:0;
  background:transparent;
  color:#d0d0d0;
  padding:13px 15px;
  border-radius:11px;
  width:100%;
  text-align:left;
  margin:4px 0;
}
nav button.active,nav button:hover{
  background:#494949;
  color:#ffffff;
}
nav .small{
  font-size:10px;
  letter-spacing:2px;
  color:#aaaaaa;
  margin:21px 14px 9px;
}
main{
  padding:38px 5%;
  max-width:1400px;
  width:100%;
  margin:auto;
}
h1{
  font-size:clamp(28px,4vw,47px);
  margin:0 0 9px;
  letter-spacing:-2px;
}
h2{font-size:22px;margin:0 0 15px}
p{line-height:1.65}
.muted{color:#bcbcbc}
.topline{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  flex-wrap:wrap;
  margin-bottom:27px;
}
.btn{
  border:1px solid #707070;
  background:#424242;
  color:#e8e8e8;
  border-radius:9px;
  padding:11px 16px;
  font-weight:700;
}
.btn.primary{
  background:#e8e8e8;
  color:#333333;
  border-color:#e8e8e8;
}
.btn:hover{filter:brightness(1.11)}
.grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:14px;
}
.card{
  border:1px solid #606060;
  background:#3c3c3c;
  border-radius:16px;
  padding:20px;
}
.card h3{
  line-height:1.35;
  font-size:20px;
  margin:14px 0;
}
.card .actions{
  display:flex;
  gap:7px;
  margin-top:20px;
  flex-wrap:wrap;
}
input,textarea,select{
  background:#383838;
  color:#e8e8e8;
  border:1px solid #727272;
  border-radius:9px;
  padding:12px;
  width:100%;
}
textarea{min-height:125px;resize:vertical}
label{
  display:block;
  font-size:12px;
  font-weight:800;
  color:#d0d0d0;
  margin:17px 0 8px;
}
.tag{
  color:#e8e8e8;
  text-transform:uppercase;
  letter-spacing:1.3px;
  font-size:10px;
  font-weight:800;
}
.meta{font-size:12px;color:#bcbcbc}
.mini{font-size:12px}
.banner{
  padding:16px 20px;
  border:1px solid #858585;
  background:#484848;
  border-radius:12px;
  margin:17px 0;
  color:#e8e8e8;
}
.danger{
  background:#543b3b;
  border-color:#9c7373;
  color:#f0c7bb;
}

/* Monochrome editorial system */
:root{color-scheme:dark}
::selection{background:#e8e8e8;color:#333333}
:focus-visible{outline:2px solid #e8e8e8;outline-offset:3px}
.btn,.card,nav button,.news-edge-arrow{transition:background-color .18s ease,border-color .18s ease,transform .18s ease}
.btn:hover:not(:disabled){background:#555555;filter:none}
.btn.primary:hover:not(:disabled){background:#ffffff;color:#333333}
.card:hover{border-color:#898989}
nav button.active{font-weight:800;border-left:2px solid #e8e8e8}
input:focus,textarea:focus,select:focus{border-color:#e8e8e8;outline:none}

/* theDĀW signature red: intentional, restrained accents */
:root{--daw-base:#333333;--daw-light:#e8e8e8;--daw-red:#B30012}
.logo::first-letter{color:var(--daw-red)}
.pill{border-color:var(--daw-red)}
.pill::first-letter{color:var(--daw-red)}
nav button.active{border-left-color:var(--daw-red);background:#484042}
nav button.active:hover{background:#554346}
.btn.primary{background:var(--daw-red);border-color:var(--daw-red);color:#ffffff}
.btn.primary:hover:not(:disabled){background:#cf1024;color:#ffffff;border-color:#cf1024}
.tag{color:#ff6876}
.news-page-numbers .selected{color:#ff6876}
.news-edge-arrow:hover:not(:disabled){border-color:var(--daw-red);color:#ffffff}
:focus-visible{outline-color:#ff6876}
input:focus,textarea:focus,select:focus{border-color:#c84a58}
.design-toggle-row input{accent-color:var(--daw-red)}

/* НОВОСТИ */
.news-heading{margin-bottom:18px}
.news-heading h1{font-size:clamp(28px,3vw,42px)}
.news-heading p{margin:5px 0 0;font-size:13px}
.news-grid{
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:12px;
}
.news-card{
  padding:15px 17px;
  border-radius:13px;
  display:flex;
  flex-direction:column;
  min-width:0;
}
.news-card h3{
  font-size:clamp(15px,1.08vw,18px);
  line-height:1.27;
  margin:9px 0 7px;
  display:-webkit-box;
  -webkit-box-orient:vertical;
  -webkit-line-clamp:3;
  line-clamp:3;
  overflow:hidden;
}
.news-summary{
  display:-webkit-box;
  -webkit-box-orient:vertical;
  -webkit-line-clamp:3;
  line-clamp:3;
  overflow:hidden;
  font-size:12.5px;
  line-height:1.4;
  max-height:4.2em;
  margin:0 0 10px;
}
.news-meta{font-size:11px;margin-top:auto}
.news-card .actions{margin-top:10px;gap:6px}
.news-card .actions .btn{
  font-size:11.5px;
  padding:8px 10px;
  white-space:nowrap;
}
.news-carousel{
  display:grid;
  grid-template-columns:36px minmax(0,1fr) 36px;
  gap:12px;
  align-items:center;
}
.news-carousel>.news-grid{
  grid-column:2;
  grid-row:1;
}
.news-edge-arrow{
  width:36px;
  height:60px;
  border:1px solid #626262;
  border-radius:9px;
  background:#404040;
  color:#e8e8e8;
  font-size:39px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.news-edge-arrow:disabled{opacity:.24}
.news-edge-left{grid-column:1;grid-row:1}
.news-edge-right{grid-column:3;grid-row:1}
.news-pagination{
  display:flex;
  justify-content:center;
  align-items:center;
  margin:14px 0;
}
.news-page-numbers{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
}
.news-page-numbers .btn{
  border:0;
  background:transparent;
  padding:4px 6px;
  color:#c3c3c3;
}
.news-page-numbers .selected{
  color:#e8e8e8;
  text-decoration:underline;
  text-underline-offset:5px;
}
.news-page-ellipsis{color:#bcbcbc}

/* ДИЗАЙН */
.design-layout{
  display:grid;
  grid-template-columns:minmax(270px,400px) minmax(270px,1fr);
  gap:22px;
  align-items:start;
}
.design-form{display:grid;gap:12px}
.design-form label{margin:0}
.design-stage{
  display:flex;
  justify-content:center;
  background:#424242;
  padding:16px;
  border-radius:15px;
}
#designCanvas{
  width:100%;
  max-width:410px;
  aspect-ratio:9/16;
  touch-action:none;
  cursor:grab;
}
@media(max-width:1000px){
  .news-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:800px){
  .design-layout{grid-template-columns:1fr}
  .design-stage{order:-1}
  #designCanvas{max-width:330px}
}
@media(max-width:670px){
  .app{display:block}
  nav{
    display:flex;
    overflow-x:auto;
    border-right:none;
    border-bottom:1px solid #575757;
    padding:7px;
  }
  nav button{white-space:nowrap;font-size:12px}
  nav .small{display:none}
  main{padding:25px 17px}
  .grid,.news-grid{grid-template-columns:1fr}
  .logo span{display:none}
  .card{padding:15px}
  .news-carousel{
    grid-template-columns:28px minmax(0,1fr) 28px;
    gap:5px;
  }
  .news-edge-arrow{width:28px;height:48px;font-size:30px}
  .news-page-numbers{gap:5px}
}

/* Scroll design settings separately from preview */
@media(min-width:801px){.design-layout{align-items:start}.design-form{max-height:calc(100vh - 185px);overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#777777 #3c3c3c}.design-stage{position:sticky;top:18px;max-height:calc(100vh - 110px);overflow:hidden}.design-stage canvas{max-height:calc(100vh - 145px);width:auto;max-width:100%;height:auto}}
.design-toggle-row{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:11px 0;margin:4px 0}.design-toggle-row input{width:43px;height:23px;accent-color:#e8e8e8;cursor:pointer}

/* Light editorial palette: inverted base and text */
:root{--daw-base:#e8e8e8;--daw-light:#333333;color:#333333;background:#e8e8e8;color-scheme:light}
body{background:#e8e8e8;color:#333333}
header,nav{background:#e8e8e8;border-color:#c7c7c7}
.logo{color:#333333}
.logo span{color:#686868}
.pill{background:#f7f7f7;color:#333333;border-color:#B30012}
nav button{color:#4d4d4d}
nav button:hover{background:#d8d8d8;color:#333333}
nav button.active,nav button.active:hover{background:#f5dfe2;color:#333333;border-left-color:#B30012}
nav .small,.muted,.meta,.news-page-ellipsis{color:#656565}
a{color:#8d0010}
.btn{background:#f8f8f8;color:#333333;border-color:#c0c0c0}
.btn:hover:not(:disabled){background:#dedede}
.btn.primary{background:#B30012;color:#ffffff;border-color:#B30012}
.btn.primary:hover:not(:disabled){background:#ce1227;color:#ffffff;border-color:#ce1227}
.card{background:#f8f8f8;border-color:#d0d0d0;color:#333333}
.card:hover{border-color:#adadad}
input,textarea,select{background:#ffffff;color:#333333;border-color:#c4c4c4}
label{color:#454545}
.tag,.news-page-numbers .selected{color:#B30012}
.news-page-numbers .btn{color:#626262}
.news-page-numbers .selected{color:#B30012}
.news-edge-arrow{background:#f8f8f8;color:#333333;border-color:#c7c7c7}
.news-edge-arrow:hover:not(:disabled){color:#B30012;border-color:#B30012}
.design-stage{background:#d6d6d6}
.banner{background:#f5f5f5;border-color:#c8c8c8;color:#333333}
.danger{background:#fbe9eb;border-color:#c97780;color:#8d0010}
::selection{background:#B30012;color:#ffffff}
:focus-visible{outline-color:#B30012}
input:focus,textarea:focus,select:focus{border-color:#B30012}
@media(max-width:670px){nav{border-bottom-color:#c7c7c7}}
@media(min-width:801px){.design-form{scrollbar-color:#b7b7b7 #e8e8e8}}

/* Liquid Glass — translucent, softly refracting interface surfaces */
:root{
  --glass-fill:rgba(255,255,255,.44);
  --glass-stroke:rgba(255,255,255,.78);
  --glass-shadow:0 12px 34px rgba(45,45,45,.085),inset 0 1px 0 rgba(255,255,255,.86);
}
body{
  min-height:100vh;
  background:
    radial-gradient(ellipse 55% 42% at 85% 9%,rgba(179,0,18,.105),transparent 75%),
    radial-gradient(ellipse 46% 38% at 7% 72%,rgba(255,255,255,.92),transparent 76%),
    radial-gradient(ellipse 60% 50% at 55% 98%,rgba(177,181,192,.27),transparent 78%),
    #e8e8e8;
  background-attachment:fixed;
}
header,nav{
  background:rgba(250,250,250,.46);
  border-color:rgba(255,255,255,.7);
  -webkit-backdrop-filter:blur(22px) saturate(145%);
  backdrop-filter:blur(22px) saturate(145%);
}
header{position:relative;z-index:2;box-shadow:0 1px 0 rgba(130,130,130,.12)}
nav{box-shadow:inset -1px 0 rgba(110,110,110,.1)}
.card,.design-stage,.banner{
  background:linear-gradient(145deg,rgba(255,255,255,.67),rgba(255,255,255,.30) 65%,rgba(255,255,255,.50));
  border:1px solid var(--glass-stroke);
  box-shadow:var(--glass-shadow);
  -webkit-backdrop-filter:blur(18px) saturate(155%);
  backdrop-filter:blur(18px) saturate(155%);
}
.card{border-radius:20px}
.card:hover{border-color:rgba(255,255,255,.98);box-shadow:0 16px 38px rgba(45,45,45,.12),inset 0 1px 0 #fff}
.design-stage{border-radius:20px}
.btn:not(.primary),.news-edge-arrow,.pill{
  background:linear-gradient(155deg,rgba(255,255,255,.83),rgba(255,255,255,.38));
  border:1px solid rgba(255,255,255,.88);
  box-shadow:0 4px 13px rgba(50,50,50,.08),inset 0 1px 0 rgba(255,255,255,.95);
  -webkit-backdrop-filter:blur(12px) saturate(145%);
  backdrop-filter:blur(12px) saturate(145%);
}
.btn:not(.primary):hover:not(:disabled),.news-edge-arrow:hover:not(:disabled){
  background:rgba(255,255,255,.88);
  border-color:rgba(179,0,18,.34);
}
.btn.primary{box-shadow:0 5px 14px rgba(179,0,18,.18),inset 0 1px 0 rgba(255,255,255,.22)}
nav button.active,nav button.active:hover{
  background:linear-gradient(110deg,rgba(179,0,18,.13),rgba(255,255,255,.52));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.75);
}
input,textarea,select{background:rgba(255,255,255,.74);border-color:rgba(145,145,145,.34)}
@supports not ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){
  header,nav{background:#f0f0f0}
  .card,.design-stage,.banner{background:#f8f8f8;border-color:#d2d2d2}
  .btn:not(.primary),.news-edge-arrow,.pill{background:#fafafa;border-color:#d2d2d2}
}
@media(prefers-reduced-motion:reduce){
  .btn,.card,nav button,.news-edge-arrow{transition:none}
}

/* Two-section navigation and constructor workspace */
.constructor-heading{margin-bottom:20px}
.constructor-heading h1{margin-bottom:5px}
.constructor-heading p{margin:0;font-size:13px}
.constructor-tabs{display:flex;flex-wrap:wrap;gap:9px;margin:0 0 27px;padding:8px;background:rgba(255,255,255,.42);border:1px solid rgba(255,255,255,.8);border-radius:16px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.constructor-tab{border:1px solid transparent;border-radius:11px;padding:11px 15px;background:transparent;color:#444;font-weight:750}
.constructor-tab:hover{background:rgba(255,255,255,.65)}
.constructor-tab.active{background:#B30012;color:#fff;box-shadow:0 4px 12px rgba(179,0,18,.17)}
@media(max-width:670px){.constructor-tabs{flex-wrap:nowrap;overflow-x:auto}.constructor-tab{white-space:nowrap;flex-shrink:0}}

/* Minimal centered paired section switch — no sidebar */
.app{display:block;min-height:calc(100vh - 74px)}
main{max-width:1440px;margin:0 auto}
header{position:relative;display:flex;align-items:center;justify-content:space-between;min-height:74px}
.section-switch{
 position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
 display:flex;align-items:center;gap:5px;z-index:3;
}
.section-switch button{
 border:1px solid rgba(255,255,255,.94);
 background:linear-gradient(145deg,rgba(255,255,255,.89),rgba(255,255,255,.55));
 color:#333333;box-shadow:0 5px 18px rgba(51,51,51,.10),inset 0 1px rgba(255,255,255,.9);
 backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);
 font-weight:800;transition:background .15s,transform .15s,border-color .15s;
}
.section-switch button:hover{background:#fff;border-color:rgba(179,0,18,.55);transform:translateY(-1px)}
.section-switch-main{height:43px;min-width:166px;padding:0 21px;border-radius:14px;font-size:14px}
.section-switch-icon{height:43px;width:43px;display:grid;place-items:center;border-radius:13px;font-size:23px;line-height:1;color:#B30012!important}
@media(max-width:760px){
 header{height:auto;min-height:112px;padding:13px 17px;align-items:flex-start}
 .section-switch{top:auto;bottom:12px;transform:translateX(-50%)}
 .section-switch-main{min-width:156px}
 .logo{font-size:21px}
 .pill{font-size:9px;padding:6px 8px}
}
.source-row{display:flex;align-items:center;gap:16px;margin-top:12px}.source-description{flex:1;min-width:0;overflow-wrap:anywhere}.source-description p{margin:5px 0}.source-row input[type=checkbox]{width:20px;height:20px}\n
/* theDĀW Liquid Glass — definitive light palette */
:root{color-scheme:light;--daw-base:#e8e8e8;--daw-light:#333333;--daw-red:#B30012}
html{background:#e8e8e8;color:#333333}
body{color:#333333}
header{color:#333333}
.logo,.logo span{color:#333333}
.pill{color:#333333}
.card,.banner,.constructor-tabs{color:#333333}
.news-card,.source-row{background:linear-gradient(145deg,rgba(255,255,255,.68),rgba(255,255,255,.32));border:1px solid rgba(255,255,255,.82);box-shadow:0 12px 34px rgba(45,45,45,.085),inset 0 1px 0 rgba(255,255,255,.86);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.btn.primary,.constructor-tab.active{background:#B30012;color:#fff;border-color:#B30012}

/* theDĀW 2026 — screenshot-inspired editorial workspace */
:root{font-family:Arial,Helvetica,sans-serif;--daw-red:#bb0018}
body{background:radial-gradient(ellipse 42% 60% at 91% 34%,rgba(179,0,25,.52),transparent 80%),radial-gradient(ellipse 45% 54% at 9% 84%,rgba(226,100,117,.36),transparent 80%),linear-gradient(112deg,#f8f8f8 3%,#ededed 47%,#f4e9eb 100%);background-attachment:fixed}

.logo span{display:none}
header>.pill{display:none}

.section-switch-icon{height:43px;width:43px;border-radius:50%;border:1px solid #c81c37!important;color:#b50018!important;background:rgba(244,209,214,.54)!important;font-size:24px;box-shadow:0 2px 3px #0002!important}
.section-switch button{box-shadow:0 2px 5px #0002,inset 0 1px 2px #fff!important;border:1px solid #e0e0e0}
.app{min-height:calc(100vh - 241px)}
main{max-width:none;padding:30px 2.65% 65px}
.btn,.pill,input,textarea,select{border-radius:28px}
.btn:not(.primary),input,textarea,select{box-shadow:inset 0 1px 3px #0002,0 2px 2px #0001}
.btn.primary{border-radius:30px;background:#b90018;border-color:#b90018;box-shadow:0 2px 3px #0004}
.card{border-radius:30px;border:1px solid #dedede;box-shadow:2px 3px 3px #0002,inset 0 1px 0 #fff;background:rgba(255,255,255,.66)}
.news-view{max-width:630px;margin:50px auto 0}
.news-heading{justify-content:flex-end;align-items:center;margin:0 0 12px}
.news-heading>div{display:none}
.news-heading #sourcesManage{font-size:11px;padding:6px 21px}

.news-carousel{display:block;position:relative}
.news-grid{display:block;position:relative;min-height:305px}
.news-card{position:relative;min-height:305px;padding:28px 30px 60px;border-radius:35px;background:rgba(255,255,255,.90)}
.news-card:not(:first-child){display:none}

.news-card:first-child:after{left:5%;width:90%;bottom:-29px;z-index:-2}
.news-card .actions{position:absolute;bottom:19px;right:23px;margin:0}

/* Fix: one continuous animated background, without a second overlapping layer */

body{
  position:static;isolation:auto;
  background-image:
    radial-gradient(ellipse 55% 62% at 92% 30%,rgba(208,33,59,.53),transparent 78%),
    radial-gradient(ellipse 48% 58% at 7% 86%,rgba(232,112,132,.36),transparent 78%),

<script>
const K='thedaw_studio_v02';

const DAW_API='https://thedaw-ai.lunarinkee.workers.dev';

let editorRole='guest';

async function editorRequest(path,body={}){
  if(!editorSession)throw Error('Нужен вход редактора');
  const response=await fetch(DAW_API+path,{
    method:'POST',headers:{'Content-Type':'application/json','X-Editor-Session':editorSession},
    body:JSON.stringify(body),cache:'no-store'
  });
  const value=await response.json().catch(()=>({}));
  if(!response.ok||!value.ok){
    if(response.status===401)editorLogout('Сессия редактора истекла. Войди ещё раз.');
    throw Error(value.error||'Не удалось проверить доступ');
  }

function showEditorLogin(){

    '<div id="dawLoginError" class="daw-login-error" role="alert" aria-live="polite"></div>'+

    try{

      });
      const result=await res.json().catch(()=>({}));

  if(!isEditor()){showEditorLogin();return;}

    id:'d'+Date.now(),

    sourceSummary:n.summary,
    originalTitle:n.title,
    originalSummary:n.summary,
    sourceName:n.source,
    headline:n.title,
    caption:(n.title)+'\n\n'+(n.summary)+
      '\n\nИсточник: '+n.source+' — '+n.url,
    tiktok:n.title,
    category:n.category
  };

  constructorTab='drafts';

function newsTimestamp(n){
  const raw=String(
    n.published_at||n.date||n.published||n.pubDate||''
  ).trim();

  const ru=raw.match(
    /^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})(?:\s+(\d{1,2}):(\d{2}))?/
  );

  if(ru){
    const d=new Date(
      Number(ru[3]),
      Number(ru[2])-1,
      Number(ru[1]),
      Number(ru[4]||0),
      Number(ru[5]||0)
    );

    return d.getFullYear()===Number(ru[3]) &&
      d.getMonth()===Number(ru[2])-1 &&
      d.getDate()===Number(ru[1])
      ?d.getTime():NaN;
  }

  return Date.parse(raw);
}

function displayNewsTitle(value){
  return String(value||'')
    .replace(/^\s*\d{1,2}:\d{2}(?::\d{2})?\s*[,|–—-]?\s*\d{1,2}\s+[А-Яа-яЁё]+\s+\d{4}(?:\s*г(?:ода|\.)?)?\s*[,|–—:-]?\s*/u,'')
    .replace(/^\s*\d{1,2}[.\/-]\d{1,2}[.\/-]\d{4}\s*(?:[,|–—-]\s*)?/u,'')
    .trim();
}

function recentNews(items){
  const now=Date.now();

  return items.filter(n=>{
    const t=newsTimestamp(n);
    return Number.isFinite(t) &&
      t>=now-36*60*60*1000 &&
      t<=now+5*60*1000;
  }).sort((a,b)=>newsTimestamp(b)-newsTimestamp(a));
}


let sourceEditor=[];
let sourceToken='';
let sourceSha='';
async function saveSources(){
 const status=document.getElementById('sourceStatus');
 if(!sourceToken){status.textContent='Для сохранения подключите GitHub.';return false;}
 status.textContent='Сохраняем источники в GitHub…';
 try{
  const endpoint='https://api.github.com/repos/lunarinkee-dmg/thedaw_studio/contents/sources.json';
  const headers={'Authorization':'Bearer '+sourceToken,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
  const current=await fetch(endpoint,{headers,cache:'no-store'});
  if(!current.ok)throw Error('Не удалось прочитать файл: HTTP '+current.status);
  const info=await current.json();
  const raw=unescape(encodeURIComponent(JSON.stringify(sourceEditor,null,2)+'\n'));
  const encoded=btoa(raw);
  const response=await fetch(endpoint,{method:'PUT',headers:{...headers,'Content-Type':'application/json'},body:JSON.stringify({message:'Update news sources from theDAW Studio',content:encoded,sha:info.sha})});
  if(!response.ok)throw Error('GitHub HTTP '+response.status+': '+(await response.text()).slice(0,160));
  status.textContent='Сохранено в GitHub. Агрегатор применит изменения при следующем запуске.';
  return true;
 }catch(e){status.textContent='Ошибка сохранения: '+e.message;return false;}
}

 const m=document.getElementById('main');
 m.innerHTML='<h1>Источники новостей</h1><p class="muted">Добавляйте и управляйте сайтами прямо здесь. Для записи изменений требуется доступ GitHub.</p><p id="sourceStatus" class="muted">Загрузка…</p><div class="card"><label>GitHub fine-grained token (Contents: Read and write)</label><input id="sourceToken" type="password" autocomplete="off" placeholder="github_pat_…"><button class="btn" id="sourceConnect">Подключить GitHub</button><p class="muted">Токен действует только в открытой вкладке, не сохраняется в браузере. Никому его не передавайте.</p><label>URL сайта</label><input id="sourceUrl" type="url" placeholder="https://example.com"><label>Категория</label><select id="sourceCategory"><option>Казахстан / ЦА</option><option>Музыка</option><option>Кино / сериалы</option><option>Искусство / культура</option><option>ИИ</option><option>Азия</option></select><div class="actions"><button class="btn primary" id="sourceAdd">+ Добавить</button><button class="btn" id="sourceSave">Сохранить изменения</button><button class="btn" id="sourceBack">← Новости</button></div></div><div id="sourceList"></div>';
 document.getElementById('sourceBack').onclick=render;
 document.getElementById('sourceConnect').onclick=()=>{sourceToken=document.getElementById('sourceToken').value.trim();document.getElementById('sourceToken').value='';document.getElementById('sourceStatus').textContent=sourceToken?'Токен введён. Нажмите «Сохранить изменения», чтобы проверить доступ.':'Введите токен GitHub.';};
 document.getElementById('sourceSave').onclick=async()=>{const btn=document.getElementById('sourceSave');btn.disabled=true;try{await saveSources();}finally{btn.disabled=false;}};
 document.getElementById('sourceAdd').onclick=()=>{
  let url;try{url=new URL(document.getElementById('sourceUrl').value.trim());if(!['http:','https:'].includes(url.protocol))throw Error();}catch{alert('Введите корректный URL с https://');return;}
  if(sourceEditor.some(s=>s.url===url.href)){alert('Сайт уже добавлен');return;}
  sourceEditor.push({name:url.hostname,url:url.href,category:document.getElementById('sourceCategory').value,enabled:true});
  document.getElementById('sourceUrl').value='';drawSourceList();document.getElementById('sourceStatus').textContent='Источник добавлен в список. Нажмите «Сохранить изменения».';
 };
 try{
  const response=await fetch('sources.json?ts='+Date.now(),{cache:'no-store'});
  if(!response.ok)throw Error('HTTP '+response.status);
  const list=await response.json();if(!Array.isArray(list))throw Error('Неверный формат');
  sourceEditor=list;
  document.getElementById('sourceStatus').textContent='Источников: '+list.length+'. Подключите GitHub, чтобы сохранять изменения на сайте.';
 }catch(e){document.getElementById('sourceStatus').textContent='Не удалось прочитать список: '+e.message;}
 drawSourceList();
}
function drawSourceList(){
 const box=document.getElementById('sourceList');if(!box)return;
 box.innerHTML=sourceEditor.length?'':'<p class="muted">Список пуст. Добавьте первый сайт.</p>';
 sourceEditor.forEach((s,i)=>{
  const row=document.createElement('div');row.className='card source-row';
  const label=document.createElement('div');label.className='source-description';
  const name=document.createElement('strong');name.textContent=s.name||s.url;

  const remove=document.createElement('button');remove.className='btn';remove.textContent='Удалить';remove.onclick=()=>{sourceEditor.splice(i,1);drawSourceList();document.getElementById('sourceStatus').textContent='Источник удалён из списка. Нажмите «Сохранить изменения».';};
  row.append(label,toggle,remove);box.append(row);
 });
}

    const approve=m.querySelector('#dawApproveNews');if(approve)approve.onclick=()=>{

          sourceSummary:n.summary,originalTitle:n.title,originalSummary:n.summary,

    m.querySelector('#exportDrafts').onclick=()=>{

async function load(manual=false){
  if(newsLoading)return;
  newsLoading=true;
  newsError='';
  if(view==='inbox')render();
  try{
    if(manual){
      try{
        // Read-only, server-side publisher check. No GitHub token in the browser.
        const response=await fetch('https://thedaw-ai.lunarinkee.workers.dev/news/refresh',{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:'{}',
          cache:'no-store',
          signal:AbortSignal.timeout(45000)
        });
        const payload=await response.json().catch(()=>({}));
        if(!response.ok||payload.ok!==true||!Array.isArray(payload.news)){
          throw Error(payload.error||'Cloudflare HTTP '+response.status);
        }
        const now=Date.now();
        data.news=payload.news.filter(item=>{
          const published=Date.parse(item.published_at||'');
          return Number.isFinite(published)&&published>=now-36*60*60*1000&&published<=now+5*60*1000;
        }).sort((a,b)=>Date.parse(b.published_at)-Date.parse(a.published_at));
        if(!data.news.length){
          newsError='Источники проверены. За последние 36 часов новых публикаций не найдено.';
        }else if(payload.sources_errors?.length){
          newsError='Часть источников недоступна: '+payload.sources_errors.join('; ').slice(0,260);
        }
      }catch(workerError){
        // Keep the site useful before the new Worker version is deployed.
        // Be explicit that the cached dataset is NOT a real-time scan.
        const response=await fetch('./news.json?v='+Date.now(),{cache:'no-store'});
        if(!response.ok)throw Error('Cloudflare: '+workerError.message+'; news.json HTTP '+response.status);
        const saved=await response.json();
        if(!Array.isArray(saved))throw Error('Некорректный news.json');
        data.news=recentNews(saved);
        newsError='Проверка в реальном времени пока недоступна ('+workerError.message+'). Показаны новости последнего автоматического сбора GitHub Actions.';
      }
      newsPage=1;
    }else{
      const response=await fetch('./news.json?v='+Date.now(),{cache:'no-store'});
      if(!response.ok)throw Error('news.json HTTP '+response.status);
      const items=await response.json();
      if(!Array.isArray(items))throw Error('Некорректный формат новостей');
      data.news=recentNews(items);
    }
  }catch(e){
    newsError='Не удалось обновить новости: '+e.message;
  }finally{
    newsLoading=false;
    if(view==='inbox'||view==='guest')render();
  }
}

async function loadReelsAnalytics(){
  const output=document.getElementById('dawAnalyticsResults');
  const btn=document.getElementById('dawLoadAnalytics');
  if(!output||!btn)return;
  btn.disabled=true;
  output.textContent='Загружаем метрики Instagram… Это может занять до минуты.';
  const fmt=n=>typeof n==='number'?new Intl.NumberFormat('ru-RU').format(n):'—';
  try{
    const response=await fetch(DAW_API+'/instagram/analytics',{
      method:'POST',
      headers:{'Content-Type':'application/json','X-Editor-Session':editorSession},
      body:'{}',cache:'no-store',signal:AbortSignal.timeout(90000)
    });
    const payload=await response.json().catch(()=>({}));
    if(!response.ok||payload.ok!==true)throw Error(payload.error||'HTTP '+response.status);
    if(!Array.isArray(payload.items))throw Error('Некорректный ответ Instagram');
    output.replaceChildren();
    const counter=document.createElement('p');
    counter.className='muted';counter.textContent='Найдено Reels: '+payload.items.length+' · Обновлено: '+new Date(payload.checked_at).toLocaleString('ru-RU');
    output.append(counter);
    for(const reel of payload.items){
      const el=document.createElement('article');
      el.className='card daw-reel-analytics';
      const captionText=String(reel.caption||'').trim();
      const titleText=String(reel.title||captionText.split('\n')[0]||'Reels без заголовка').trim();
      const top=document.createElement('div');top.className='daw-reel-top';
      const imageSrc=[reel.thumbnail_url,reel.thumbnail,reel.cover_url,reel.poster_url,reel.media?.thumbnail_url,reel.media?.thumbnail].find(u=>typeof u==='string'&&/^https:\/\//.test(u));
      const placeholder=()=>{const p=document.createElement('div');p.className='daw-reel-thumb-placeholder';p.textContent='▧';return p;};
      if(imageSrc){
        const image=document.createElement('img');image.className='daw-reel-thumb';
        image.alt='Обложка Reels';image.loading='lazy';
        image.onerror=()=>image.replaceWith(placeholder());
        image.src=imageSrc;
        top.append(image);
      }else top.append(placeholder());
      const intro=document.createElement('div');intro.className='daw-reel-intro';
      const heading=document.createElement('h3');heading.textContent=titleText;intro.append(heading);
      if(reel.permalink&&/^https:\/\//.test(reel.permalink)){
        const link=document.createElement('a');link.className='daw-reel-link';link.href=reel.permalink;
        link.textContent='↗ Открыть Reels';link.target='_blank';link.rel='noopener noreferrer';intro.append(link);
      }
      top.append(intro);el.append(top);
      const grid=document.createElement('div');grid.className='daw-reel-kpis';
      const num=n=>typeof n==='number'&&Number.isFinite(n)?new Intl.NumberFormat('ru-RU').format(n):null;
      const pct=n=>typeof n==='number'&&Number.isFinite(n)?n.toLocaleString('ru-RU',{maximumFractionDigits:1})+'%':null;
      const secs=n=>typeof n==='number'&&Number.isFinite(n)?n.toLocaleString('ru-RU',{maximumFractionDigits:1})+' сек':null;
      const duration=n=>{
        if(typeof n!=='number'||!Number.isFinite(n))return null;
        const total=Math.round(n);
        return total<60?total+' сек':Math.floor(total/60)+' мин '+String(total%60).padStart(2,'0')+' сек';
      };
      const tile=(parent,label,value,icon,delta=null,total=null)=>{
        if(value===null)return;
        const cell=document.createElement('div');cell.className='daw-reel-kpi';
        const labelNode=document.createElement('div');labelNode.className='daw-reel-kpi-label';labelNode.textContent=icon+' '+label;
        const valueNode=document.createElement('strong');valueNode.className='daw-reel-value';
        const amount=document.createElement('span');amount.textContent=value;valueNode.append(amount);
        const actual=typeof delta==='number'?delta:delta?.value;
        const hasActual=typeof actual==='number'&&Number.isFinite(actual);
        const increment=hasActual?actual:typeof total==='number'&&Number.isFinite(total)?Math.round(total*0.035):null;
        if(increment!==null){
          const change=document.createElement('span');
          change.className='daw-reel-delta'+(hasActual?'':' daw-reel-delta-demo')+(increment<0?' negative':'');
          const symbol=document.createElement('span');symbol.className='daw-reel-trend-icon';symbol.setAttribute('aria-hidden','true');symbol.textContent='↗';
          change.append(symbol,document.createTextNode((increment<0?'−':'+')+new Intl.NumberFormat('ru-RU').format(Math.abs(increment))));
          if(!hasActual)change.title='Демонстрационный прирост (3,5%), не реальные данные';
          valueNode.append(change);
        }
        cell.append(labelNode,valueNode);parent.append(cell);
      };
      tile(grid,'Просмотры',num(reel.views),'◉',reel.hourly_views_delta,reel.views);
      tile(grid,'Охват',num(reel.reach),'♧',reel.hourly_reach_delta,reel.reach);
      tile(grid,'Вовлечённость',pct(reel.engagement_rate),'♡');
      tile(grid,'Среднее время просмотра',secs(reel.avg_watch_time_seconds),'◷');
      tile(grid,'Репосты',num(reel.shares),'↗');
      tile(grid,'Сохранения',num(reel.saves),'▢');
      if(grid.childElementCount)el.append(grid);
      const details=document.createElement('details');details.className='daw-reel-details';
      const summary=document.createElement('summary');summary.textContent='Подробная статистика';details.append(summary);
      const extra=document.createElement('div');extra.className='daw-reel-kpis';
      tile(extra,'Лайки',num(reel.likes),'♡');
      tile(extra,'Комментарии',num(reel.comments),'☰');
      tile(extra,'Взаимодействия',num(reel.interactions),'✦');
      tile(extra,'Общее время просмотра',secs(reel.total_watch_time_seconds),'◷');
      tile(extra,'Ранние пропуски',pct(reel.skip_rate),'↷');
      if(extra.childElementCount){details.append(extra);el.append(details);}
      output.append(el);
    }
    if(!payload.items.length){const p=document.createElement('p');p.textContent='Опубликованные Reels не найдены.';output.append(p);}
  }catch(e){output.textContent='Ошибка статистики: '+e.message+'. Проверь права Instagram API и обновлённый Worker.';}
  finally{btn.disabled=false;}
}

async function generateAI(id){
  if(!isEditor()){showEditorLogin();return;}
  const d=data.drafts.find(x=>x.id===id);
  if(!d)return;
  const button=document.getElementById('dawGenerate');
  const status=document.getElementById('dawStatus');
  if(button){button.disabled=true;button.textContent='Генерируем…';}
  if(status)status.textContent='Gemini готовит текст новости…';
  try{
    const response=await fetch(DAW_API+'/generate',{
      method:'POST',
      headers:{'Content-Type':'application/json','X-Editor-Session':editorSession},
      body:JSON.stringify({title:d.sourceTitle||d.headline,summary:d.sourceSummary||'',source:d.sourceName||'',url:d.sourceUrl||''}),
      cache:'no-store',
      signal:AbortSignal.timeout(45000)
    });
    const result=await response.json().catch(()=>({}));
    if(!response.ok||result.error)throw Error(result.error||'HTTP '+response.status);
    if(typeof result.headline!=='string'||typeof result.instagram!=='string'||typeof result.tiktok!=='string')throw Error('Gemini вернул неполный ответ');
    d.headline=result.headline;
    d.caption=result.instagram+'\\n\\nИсточник: '+(d.sourceName||'')+' — '+(d.sourceUrl||'');
    d.tiktok=result.tiktok;
    save();render();
    const done=document.getElementById('dawStatus');
    if(done)done.textContent='✓ Текст сгенерирован через Gemini. Проверь факты перед публикацией.';
  }catch(error){
    if(error.message.includes('Сессия')||error.message.includes('401'))editorLogout('Войди как редактор повторно.');
    const target=document.getElementById('dawStatus');
    if(target)target.textContent='Ошибка Gemini: '+error.message+'. Исходный текст не изменён.';
    if(button){button.disabled=false;button.textContent='Сгенерировать';}
  }
}

render();
restoreEditorSession();
load();
</script>

function designWrap(ctx,txt,x,y,width,size,lines,style='title'){
  const title=style==='title';
  const tracking=title?-.022*size:-.011*size;
  const leading=title?1.12:1.22;

  ctx.font=title
    ?'900 '+size+'px Montserrat,Arial,sans-serif'
    :'italic 400 '+size+'px Montserrat,Arial,sans-serif';

  const measure=t=>{
    let w=0;
    for(const ch of t){
      w+=ctx.measureText(ch).width+tracking;
    }
    return w;
  };

  let words=String(txt||'').split(/\s+/);
  let rows=[];
  let line='';

  for(const word of words){
    let next=line?line+' '+word:word;
    if(measure(next)>width&&line){
      rows.push(line);
      line=word;
    }else{
      line=next;
    }
  }

  rows.push(line);

  rows.slice(0,lines).forEach((t,i)=>{
    let xx=x;
    for(const ch of t){
      ctx.fillText(ch,xx,y+i*size*leading);
      xx+=ctx.measureText(ch).width+tracking;
    }
  });
}

function designPaint(){
  const cv=document.getElementById('designCanvas');
  if(!cv)return;

  const ctx=cv.getContext('2d');
  const s=designCfg;

  ctx.fillStyle=s.bg;
  ctx.fillRect(0,0,1080,1920);

  const media=
    designVideo&&designVideo.readyState>=2
      ?designVideo
      :designImg;

  if(media){
    const mw=media.videoWidth||media.width;
    const mh=media.videoHeight||media.height;

    if(mw>0&&mh>0){
      const k=Math.max(1080/mw,1920/mh)*
        Math.max(1,Number(s.cropZoom)||1);

      const w=mw*k;
      const h=mh*k;

      const dx=(1080-w)/2+(Number(s.cropX)||0);
      const dy=(1920-h)/2+(Number(s.cropY)||0);

      ctx.save();
      ctx.beginPath();
      ctx.rect(0,0,1080,1920);
      ctx.clip();
      ctx.drawImage(media,dx,dy,w,h);
      ctx.restore();
    }
  }

  if(s.gradient!==false){
  let top=ctx.createLinearGradient(0,0,0,520);
  top.addColorStop(0,'rgba(0,0,0,.55)');
  top.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=top;ctx.fillRect(0,0,1080,520);
  let bottom=ctx.createLinearGradient(0,670,0,1920);
  bottom.addColorStop(0,'rgba(0,0,0,0)');
  bottom.addColorStop(.5,'rgba(0,0,0,.42)');
  bottom.addColorStop(1,'rgba(0,0,0,.84)');
  ctx.fillStyle=bottom;ctx.fillRect(0,670,1080,1250);
  }

  ctx.textBaseline='top';
  ctx.fillStyle='#fff';

  if(
    designLogo&&
    designLogo.complete&&
    designLogo.naturalWidth
  ){
    ctx.drawImage(designLogo,108,106,84,129);
  }

  ctx.font='400 28.5px Arial,sans-serif';
  ctx.textAlign='right';
  ctx.fillText(s.date||designShortDate(),970,155);
  ctx.textAlign='left';

  ctx.fillStyle='#fff';

  designWrap(
    ctx,
    s.title||'ЗАГОЛОВОК НОВОСТИ',
    108,
    s.titleY,
    862,
    +s.size,
    5
  );

  ctx.fillStyle='#f3f3f3';

  designWrap(
    ctx,
    s.body||'Описание новости',
    108,
    s.bodyY,
    800,
    +s.bodySize,
    9,
    'body'
  );
}

    const duration=Math.min(

    );

    const mime=[
      'video/mp4;codecs="avc1.42E01E"',
      'video/mp4;codecs=avc1',
      'video/mp4'
    ].find(t=>MediaRecorder.isTypeSupported(t));

    if(!mime){
      notice.textContent=
        'Этот браузер не поддерживает прямой экспорт MP4.';
      return;
    }

    let recorder;
    let stream;
    let audioContext;
    let frames=[];
    let raf;
    let timer;
    let cancelled=false;
    let resolveWait;

    const finishWait=()=>{
      if(resolveWait){
        let r=resolveWait;
        resolveWait=null;

    try{
      designRecording=true;
      btn.disabled=true;

      };

        if(designCancelExport){
          designCancelExport();
        }
      };

      stream=cv.captureStream(30);
      // Mix the source video's audio and optional music into the recorded stream.
      const AC=window.AudioContext||window.webkitAudioContext;
      if((designVideo||designMusic)&&!AC)throw Error('Браузер не поддерживает обработку звука.');
      if(AC&&(designVideo||designMusic)){
        audioContext=new AC();
        const mix=audioContext.createMediaStreamDestination();
        const connectAudio=(element,volume)=>{
          const source=audioContext.createMediaElementSource(element);
          const gain=audioContext.createGain();
          gain.gain.value=volume;
          source.connect(gain);
          gain.connect(mix);
          element.muted=false;
          element.volume=1;
        };
        if(designVideo)connectAudio(designVideo,Number(document.getElementById('designOriginalVolume').value)/100);
        if(designMusic)connectAudio(designMusic,Number(document.getElementById('designMusicVolume').value)/100);
        mix.stream.getAudioTracks().forEach(track=>stream.addTrack(track));
        await audioContext.resume();
        if(designVideo){
          designVideo.currentTime=0;
          await designVideo.play();
        }
        if(designMusic){
          designMusic.currentTime=0;
          await designMusic.play();
        }
      }

      recorder=new MediaRecorder(
        stream,
        {
          mimeType:mime,
          videoBitsPerSecond:5000000
        }
      );

      recorder.ondataavailable=e=>{
        if(e.data.size&&!cancelled){
          frames.push(e.data);
        }
      };

      const completed=new Promise((resolve,reject)=>{
        recorder.onstop=resolve;
        recorder.onerror=()=>{
          reject(new Error('Ошибка записи'));
        };
      });

      recorder.start(500);

      const started=performance.now();

      function tick(){
        if(cancelled)return;

        designPaint();

        if(designRecording){
          raf=requestAnimationFrame(tick);
        }
      }

      tick();

      await new Promise(resolve=>{
        resolveWait=resolve;

        timer=setInterval(()=>{
          if(cancelled){
            finishWait();
            return;
          }

          let elapsed=(performance.now()-started)/1000;

          notice.textContent=
            'Создаём видео: '+
            Math.min(
              100,
              Math.round(elapsed/duration*100)
            )+'%';

          if(elapsed>=duration){
            finishWait();
          }
        },200);
      });

      clearInterval(timer);

      if(recorder.state!=='inactive'){
        recorder.stop();
      }

      await completed;

      if(cancelled){
        notice.textContent=
          'Экспорт отменён. Файл не сохранён.';
        return;
      }

      const blob=new Blob(
        frames,
        {type:mime}
      );

      if(publishToInstagram){
        if(blob.size>50*1024*1024)throw Error('Видео больше 50 МБ. Уменьши длительность Reels.');
        const endpoint='https://thedaw-ai.lunarinkee.workers.dev';
        const headers={'X-Editor-Session':editorSession};
        const call=async(path,body,contentType)=>{
          const response=await fetch(endpoint+path,{
            method:'POST',
            headers:{...headers,'Content-Type':contentType||'application/json'},
            body:contentType?body:JSON.stringify(body)
          });
          const data=await response.json().catch(()=>({}));
          if(!response.ok||data.error||data.ok===false){
            if(response.status===401)editorLogout('Сессия редактора истекла. Войди повторно.');
            throw Error((data.error||'HTTP '+response.status)+' ['+path+']');
          }
          return data;
        };
        notice.textContent='Загружаем Reels в Cloudflare R2…';
        const upload=await call('/instagram/upload',blob,'video/mp4');
        if(document.getElementById('designPublishMode').value==='schedule'){
          const dateValue=document.getElementById('designScheduleAt').value;
          const at=new Date(dateValue);
          if(!dateValue||!Number.isFinite(at.getTime())||at.getTime()<=Date.now()+60000)throw Error('Укажи дату минимум через минуту');
          const queued=await call('/schedule/create',{key:upload.key,caption:document.getElementById('designInstagramCaption').value.trim(),scheduled_at:at.toISOString()});
          notice.textContent='✓ Reels запланирован на '+at.toLocaleString('ru-RU')+' (ID: '+queued.id+')';
          return;
        }
        notice.textContent='Instagram обрабатывает видео…';
        const prepared=await call('/instagram/prepare',{
          key:upload.key,
          caption:document.getElementById('designInstagramCaption').value.trim()
        });
        let ready=false;
        for(let attempt=0;attempt<36;attempt++){
          await new Promise(resolve=>setTimeout(resolve,5000));
          const status=await call('/instagram/status',{creation_id:prepared.creation_id});
          if(status.ready){ready=true;break;}
          if(['ERROR','EXPIRED'].includes(status.status))throw Error('Instagram не смог обработать видео: '+(status.details||status.status));
        }
        if(!ready)throw Error('Instagram долго обрабатывает видео. Проверь публикацию позже, чтобы не создать дубль.');
        notice.textContent='Публикуем Reels в Instagram…';
        const result=await call('/instagram/publish',{creation_id:prepared.creation_id,confirm:true});
        if(current){
          const draft=data.drafts.find(d=>d.id===current);
          if(draft&&draft.newsId&&data.approved[draft.newsId]){
            data.approved[draft.newsId].published=true;
            data.approved[draft.newsId].publishedAt=new Date().toISOString();
            data.approved[draft.newsId].instagramMediaId=result.media_id;
            save();
          }
        }
        notice.textContent='✓ Reels опубликован в Instagram! ID: '+result.media_id;
      }else{
        const url=URL.createObjectURL(blob);
        const link=document.createElement('a');
        link.href=url;
        link.download='theDAW-reels-'+Date.now()+'.mp4';
        link.click();
        setTimeout(()=>URL.revokeObjectURL(url),60000);
        notice.textContent='Видео готово! MP4 сохранён со звуком, если он был добавлен.';
      }
    }catch(err){
      notice.textContent=cancelled
        ?'Экспорт отменён.'
        :'Ошибка экспорта: '+err.message;

    }finally{
      clearInterval(timer);
      finishWait();

      designRecording=false;
      designCancelExport=null;

      btn.disabled=false;
      publishBtn.disabled=false;
      cancelBtn.style.display='none';
      cancelBtn.onclick=null;

      cancelAnimationFrame(raf);

      if(recorder&&recorder.state!=='inactive'){
        try{
          recorder.stop();
        }catch(e){}
      }

      if(designMusic)designMusic.pause();
      if(audioContext)await audioContext.close().catch(()=>{});
      if(stream){
        stream.getTracks().forEach(
          t=>t.stop()
        );
      }

      frames.length=0;
      designPaint();
    }
  };



  let cv=document.getElementById('designCanvas');

  cv.onpointerdown=e=>{
    let r=cv.getBoundingClientRect();

    let y=(e.clientY-r.top)/r.height*1920;

    designDrag=
      Math.abs(y-s.titleY)<Math.abs(y-s.bodyY)
        ?'titleY'
        :'bodyY';

    cv.setPointerCapture(e.pointerId);
  };

  cv.onpointermove=e=>{
    if(!designDrag)return;

    let r=cv.getBoundingClientRect();

    s[designDrag]=Math.round(
      Math.max(
        220,
        Math.min(
          1750,
          (e.clientY-r.top)/r.height*1920
        )
      )
    );

    designPaint();
  };

  cv.onpointerup=()=>{
    designDrag=null;
    designStore();
  };

  cv.onpointercancel=()=>{
    designDrag=null;
    designStore();
  };

  if(s.image){
    designImageLoad(s.image);
  }else{
    designImg=null;
    designPaint();
  }
}
</script>
